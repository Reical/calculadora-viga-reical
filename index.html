const RHO_MIN_TABELA = [
  [20, 0.150], [25, 0.150], [30, 0.150], [35, 0.164], [40, 0.179], [45, 0.194],
  [50, 0.208], [55, 0.211], [60, 0.219], [70, 0.226], [80, 0.230], [90, 0.233],
];
function rhoMinPorFck(fck) {
  const t = RHO_MIN_TABELA;
  if (fck <= t[0][0]) return t[0][1];
  if (fck >= t[t.length - 1][0]) return t[t.length - 1][1];
  for (let i = 0; i < t.length - 1; i++) {
    const [f0, r0] = t[i], [f1, r1] = t[i + 1];
    if (fck >= f0 && fck <= f1) return r0 + ((r1 - r0) * (fck - f0)) / (f1 - f0);
  }
  return t[t.length - 1][1];
}

// largura do estribo (todos os estribos usados numa mesma seção têm a MESMA largura, sem descontar a bitola):
// - base (1 estribo, 2 ramos): Bw - 2×cobrimento
// - Bw > 30cm com mais de 2 ramos: segue a fórmula de referência do escritório —
//   2 estribos: (Bw−cobrimento)×4/6 · mais de 2 estribos: (Bw−cobrimento)×3/N, com N=2×nºestribos+1
// - Bw ≤ 30cm com mais de 2 ramos: mantém a largura cheia (estribos idênticos, montados juntos)
function larguraEstriboCalc(bw, cob, numEstribos) {
  const larguraBase = bw - 2 * cob;
  if (numEstribos <= 1) return larguraBase;
  if (bw <= 30) return larguraBase;
  if (numEstribos === 2) return (bw - cob) * (4 / 6);
  const N = 2 * numEstribos + 1;
  return (bw - cob) * (3 / N);
}

function fmt(v, d = 4) {
  if (v === null || v === undefined || Number.isNaN(v) || !Number.isFinite(v)) return "—";
  return v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
}

/* ---------- beam cross-section diagram ---------- */

function BeamSection({ Bw, H, cob, coberturaTracaoCm, coberturaCompressaoCm, momentoNegativo, phiEstriboCm, phiEstriboMm, nRamos, sCm, phiFlexaoCm, phiCompressaoCm, feixe, opFlexaoLabel, opCompressaoLabel, d, dLinha, espVert, dupla, temCompressao, compViaFlexao, nCertoTracao, unitsPerLayerTracao, camadasTracao, nCertoComp, unitsPerLayerComp, camadasComp, folgaPrimeiraCamada, distanciaEntrePernas, smaxTrans, pernasDentroLimite, larguraMinimaPerna, pernaAtendeMinimo, peleCalc, feixeVertical, feixeVerticalBarrasSoltas, estriboOk, torcaoOk, temTorcao, bielaOk }) {
  const bw = Number(Bw) || 1;
  const h = Number(H) || 1;
  const maxW = 210, maxH = 230;
  const scale = Math.min(maxW / bw, maxH / h);
  const w = bw * scale, ht = h * scale;
  const ox = 56, oy = 26;
  const sideCobPx = Math.max(2, Number(cob) * scale);
  // face de tração e face de compressão trocam de lado quando o momento é negativo
  const topCobPx = Math.max(2, (momentoNegativo ? coberturaTracaoCm : coberturaCompressaoCm) * scale);
  const bottomCobPx = Math.max(2, (momentoNegativo ? coberturaCompressaoCm : coberturaTracaoCm) * scale);
  const barRaioPx = Math.max(3, Math.min(7, (Number(phiFlexaoCm) * scale) / 2));
  const barRaioPxComp = Math.max(3, Math.min(7, (Number(phiCompressaoCm || phiFlexaoCm) * scale) / 2));
  const stepPx = Math.max(7, (Number(espVert) + Number(phiFlexaoCm)) * scale);
  const stepPxComp = Math.max(7, (Number(espVert) + Number(phiCompressaoCm || phiFlexaoCm)) * scale);
  const unidadeMeiaLargura = feixe ? barRaioPx * 2 : barRaioPx; // um feixe ocupa ~2x a largura de uma barra
  const unidadeMeiaLarguraComp = (feixe && compViaFlexao) ? barRaioPxComp * 2 : barRaioPxComp;
  const svgW = ox + w + 60, svgH = oy + ht + 34;

  // distância (px), a partir da face indicada, até o centro da camada i
  const yDaFace = (coberturaCm, i, diamCm, passo) => (Number(coberturaCm) + Number(phiEstriboCm) + Number(diamCm) / 2) * scale + i * passo;
  const yTracao = (i) => momentoNegativo ? oy + yDaFace(coberturaTracaoCm, i, phiFlexaoCm, stepPx) : oy + ht - yDaFace(coberturaTracaoCm, i, phiFlexaoCm, stepPx);
  const yCompressao = (i) => momentoNegativo ? oy + ht - yDaFace(coberturaCompressaoCm, i, phiCompressaoCm || phiFlexaoCm, stepPxComp) : oy + yDaFace(coberturaCompressaoCm, i, phiCompressaoCm || phiFlexaoCm, stepPxComp);

  // distribui n barras/feixes em `camadas` fileiras, respeitando o nº máx. por camada
  const distribuirCamadas = (n, unitsPerLayer, camadas) => {
    const linhas = [];
    let restante = n;
    for (let i = 0; i < camadas; i++) {
      const nesta = Math.min(unitsPerLayer, restante);
      linhas.push(nesta);
      restante -= nesta;
    }
    return linhas;
  };

  const desenharUnidade = (x, y, cor, preenchido, raio, feixeOverride) => {
    const r = raio || barRaioPx;
    const ehFeixe = feixeOverride !== undefined ? feixeOverride : feixe;
    if (ehFeixe) {
      return (
        <g key={`${x}-${y}`}>
          <circle cx={x - r} cy={y} r={r} fill={preenchido ? cor : "none"} stroke={cor} strokeWidth="1.8" />
          <circle cx={x + r} cy={y} r={r} fill={preenchido ? cor : "none"} stroke={cor} strokeWidth="1.8" />
        </g>
      );
    }
    return <circle key={`${x}-${y}`} cx={x} cy={y} r={r} fill={preenchido ? cor : "none"} stroke={cor} strokeWidth="1.8" />;
  };

  const desenharFileira = (n, y, cor, preenchido, raio, meiaLargura, feixeOverride) => {
    if (!n || n < 1) return null;
    const ml = meiaLargura || unidadeMeiaLargura;
    const usable = w - 2 * sideCobPx - 2 * ml;
    return Array.from({ length: n }).map((_, i) => {
      const x = n === 1 ? ox + sideCobPx + ml : ox + sideCobPx + ml + (usable * i) / (n - 1);
      return desenharUnidade(x, y, cor, preenchido, raio, feixeOverride);
    });
  };

  const linhasTracao = distribuirCamadas(nCertoTracao, unitsPerLayerTracao, camadasTracao);
  const linhasComp = temCompressao ? distribuirCamadas(nCertoComp, unitsPerLayerComp, camadasComp) : [];
  const corComp = compViaFlexao ? "var(--red-brand, var(--red))" : "var(--green)";
  const yTracao0 = yTracao(0);

  return (
    <div className="w-full max-w-[300px] mx-auto">
      <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full" role="img" aria-label="Seção transversal da viga com armadura calculada">
        <rect x={ox} y={oy} width={w} height={ht} rx="2" fill="var(--panel)" stroke="var(--ink)" strokeWidth="1.8" />
        {/* estribo calculado: para Bw>30 com mais de 2 ramos, estribos intercalados com largura reduzida (fórmula do escritório);
            caso contrário, estribos idênticos coincidentes na largura cheia */}
        {(() => {
          const numEstribosDesenho = Math.max(1, Math.round((Number(nRamos) || 2) / 2));
          const larguraCheiaPx = Math.max(0, w - 2 * sideCobPx);
          const larguraEstriboPx = Math.max(0, larguraEstriboCalc(bw, Number(cob) || 0, numEstribosDesenho) * scale);
          const intercalado = bw > 30 && numEstribosDesenho > 1;
          const stepPxEstribo = numEstribosDesenho > 1 ? (larguraCheiaPx - larguraEstriboPx) / (numEstribosDesenho - 1) : 0;
          return Array.from({ length: numEstribosDesenho }).map((_, k) => {
            const wRect = intercalado ? larguraEstriboPx : larguraCheiaPx;
            const xRect = ox + sideCobPx + (intercalado ? k * stepPxEstribo : 0);
            return (
              <rect key={k} x={xRect} y={oy + topCobPx} width={wRect} height={Math.max(0, ht - topCobPx - bottomCobPx)} rx="3" fill="none" stroke="var(--blue)" strokeWidth={k === 0 ? 1.6 : 1.3} strokeDasharray={k === 0 ? "0" : "3 2"} />
            );
          });
        })()}

        {/* camadas de tração — face indicada por momentoNegativo (topo se momento < 0, base caso contrário) */}
        {feixeVertical ? (() => {
          // 2 feixes empilhados na vertical (sem folga entre as 2 barras do mesmo feixe), um na esquerda e
          // um na direita da 1ª camada — e 0, 1 ou 2 barras soltas na 2ª camada, com a folga vertical normal (espVert)
          const dirSign = momentoNegativo ? 1 : -1; // sentido em que a 2ª camada se afasta da 1ª (em pixels y)
          const espVertPx = Number(espVert) * scale;
          const yCentro0 = yTracao(0);
          const yInferior = yCentro0 - dirSign * barRaioPx; // barra mais próxima da face de tração
          const ySuperior = yCentro0 + dirSign * barRaioPx; // a outra barra do mesmo feixe, encostada (sem folga)
          const yLone = ySuperior + dirSign * (espVertPx + barRaioPx); // barras soltas da 2ª camada, com folga normal

          const usable = w - 2 * sideCobPx - 2 * barRaioPx;
          const xEsq = ox + sideCobPx + barRaioPx;
          const xDir = ox + sideCobPx + barRaioPx + usable;
          const nSoltas = feixeVerticalBarrasSoltas || 0;

          return (
            <g>
              <circle cx={xEsq} cy={yInferior} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
              <circle cx={xEsq} cy={ySuperior} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
              <circle cx={xDir} cy={yInferior} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
              <circle cx={xDir} cy={ySuperior} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
              {nSoltas === 1 && <circle cx={ox + w / 2} cy={yLone} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />}
              {nSoltas === 2 && (
                <>
                  <circle cx={xEsq} cy={yLone} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
                  <circle cx={xDir} cy={yLone} r={barRaioPx} fill="var(--ink)" stroke="var(--ink)" strokeWidth="1.8" />
                </>
              )}
            </g>
          );
        })() : (
          linhasTracao.map((n, i) => desenharFileira(n, yTracao(i), "var(--ink)", true))
        )}

        {/* camadas de compressão — vermelho preenchido se vier da flexão (dupla), verde se vier só da torção */}
        {temCompressao && linhasComp.map((n, i) => desenharFileira(n, yCompressao(i), corComp, true, barRaioPxComp, unidadeMeiaLarguraComp, compViaFlexao ? undefined : false))}

        {/* cota H */}
        <line x1={ox - 16} y1={oy} x2={ox - 16} y2={oy + ht} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <line x1={ox - 20} y1={oy} x2={ox - 12} y2={oy} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <line x1={ox - 20} y1={oy + ht} x2={ox - 12} y2={oy + ht} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <text x={ox - 24} y={oy + ht / 2} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--ink)" fontFamily="'IBM Plex Mono', monospace" transform={`rotate(-90 ${ox - 24} ${oy + ht / 2})`}>H={h}cm</text>

        {/* cota Bw */}
        <line x1={ox} y1={oy + ht + 14} x2={ox + w} y2={oy + ht + 14} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <line x1={ox} y1={oy + ht + 10} x2={ox} y2={oy + ht + 18} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <line x1={ox + w} y1={oy + ht + 10} x2={ox + w} y2={oy + ht + 18} stroke="var(--ink-soft)" strokeWidth="1.2" />
        <text x={ox + w / 2} y={oy + ht + 28} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--ink)" fontFamily="'IBM Plex Mono', monospace">Bw={bw}cm</text>

        {/* cota d — sempre da fibra comprimida até o centro da 1ª camada de tração */}
        <line x1={ox + w + 14} y1={momentoNegativo ? oy + ht : oy} x2={ox + w + 14} y2={yTracao0} stroke="var(--blue)" strokeWidth="1.2" />
        <text x={ox + w + 20} y={(momentoNegativo ? oy + ht : oy) / 2 + yTracao0 / 2 + 4} fontSize="11" fontWeight="600" fill="var(--blue)" fontFamily="'IBM Plex Mono', monospace">d</text>
        <text x={ox + w + 20} y={(momentoNegativo ? oy + ht : oy) / 2 + yTracao0 / 2 + 16} fontSize="9" fill="var(--blue)" fontFamily="'IBM Plex Mono', monospace">{fmt(Number(d), 1)}</text>
      </svg>

      {/* legenda com os resultados calculados — fora do SVG para ficar legível */}
      <div className="mt-2 space-y-1.5 text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
        <div className="flex justify-center flex-wrap gap-1.5">
          <div
            className="inline-block px-2 py-0.5 rounded font-bold text-[11px]"
            style={{
              background: dupla ? "var(--amber-soft)" : "var(--green-soft)",
              color: dupla ? "var(--amber)" : "var(--green)",
              border: `1px solid ${dupla ? "var(--amber)" : "var(--green)"}`,
            }}
          >
            {dupla ? "ARMADURA DUPLA" : "ARMADURA SIMPLES"}
          </div>
          {estriboOk !== undefined && estriboOk !== null && (
            <div
              className="inline-block px-2 py-0.5 rounded font-bold text-[11px]"
              style={{
                background: estriboOk ? "var(--green-soft)" : "var(--red-soft, #F5E3E1)",
                color: estriboOk ? "var(--green)" : "var(--red)",
                border: `1px solid ${estriboOk ? "var(--green)" : "var(--red)"}`,
              }}
            >
              {estriboOk ? "ESTRIBO OK" : bielaOk === false ? "BIELA ESTOUROU (aumentar seção)" : "ESTRIBO NÃO ATENDE"}
            </div>
          )}
          {temTorcao && torcaoOk !== undefined && torcaoOk !== null && (
            <div
              className="inline-block px-2 py-0.5 rounded font-bold text-[11px]"
              style={{
                background: torcaoOk ? "var(--green-soft)" : "var(--red-soft, #F5E3E1)",
                color: torcaoOk ? "var(--green)" : "var(--red)",
                border: `1px solid ${torcaoOk ? "var(--green)" : "var(--red)"}`,
              }}
            >
              {torcaoOk ? "TORÇÃO OK" : "TORÇÃO NÃO ATENDE"}
            </div>
          )}
        </div>
        {momentoNegativo && (
          <div className="text-[10px] font-semibold" style={{ color: "var(--amber)" }}>Momento negativo — armadura de tração no topo</div>
        )}
        <div className="flex items-center gap-2">
          <span className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: "var(--ink)" }} />
          <span style={{ color: "var(--ink)" }}>
            Tração: <strong>{nCertoTracao || 0} {feixe ? "feixe(s)" : "barra(s)"} {opFlexaoLabel}</strong> · {camadasTracao || 0} camada(s)
          </span>
        </div>
        {temCompressao && (
          <div className="flex items-center gap-2">
            <span className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: corComp }} />
            <span style={{ color: "var(--ink)" }}>
              Compressão{compViaFlexao ? "" : " (só torção)"}: <strong>{nCertoComp || 0} {(compViaFlexao ? feixe : false) ? "feixe(s)" : "barra(s)"} {opCompressaoLabel || opFlexaoLabel}</strong> · {camadasComp || 0} camada(s)
            </span>
          </div>
        )}
        {peleCalc && (
          <div className="flex items-center gap-2">
            <span className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: peleCalc.viaTorcao ? "var(--green)" : "none", border: peleCalc.viaTorcao ? "none" : "1.6px solid var(--ink-soft)" }} />
            <span style={{ color: "var(--ink)" }}>
              Pele{peleCalc.viaTorcao ? " (torção governa)" : ""}: <strong>{peleCalc.nPorFace} {peleCalc.opPele.label}</strong> por face · c/ {fmt(peleCalc.sReal, 1)}cm
            </span>
          </div>
        )}
        <div className="flex items-center gap-2">
          <span className="inline-block w-3 h-[2px] flex-shrink-0" style={{ background: "var(--blue)" }} />
          <span style={{ color: "var(--ink)" }}>
            Estribo: <strong>{Math.round((Number(nRamos) || 2) / 2)} estribo(s) Ø{phiEstriboMm}</strong> ({nRamos} ramos) {sCm > 0 ? `· c/ ${sCm}cm` : ""}
          </span>
        </div>
        {!pernasDentroLimite && (
          <div className="text-[10px] font-semibold" style={{ color: "var(--red)" }}>
            ⚠ distância entre pernas ({fmt(distanciaEntrePernas, 1)}cm) &gt; máx. permitido ({fmt(smaxTrans, 1)}cm) — aumente o nº de ramos
          </div>
        )}
        {!pernaAtendeMinimo && (
          <div className="text-[10px] font-semibold" style={{ color: "var(--red)" }}>
            ⚠ largura do estribo ({fmt(distanciaEntrePernas, 1)}cm) &lt; mínimo de corte/dobra p/ 2 ramos ({larguraMinimaPerna}cm) — reduza a bitola do estribo
          </div>
        )}
        <div className="pl-4" style={{ color: "var(--ink-soft)" }}>
          d' = {fmt(Number(dLinha), 2)}cm · folga entre barras na 1ª camada: {Number.isFinite(folgaPrimeiraCamada) ? `${fmt(folgaPrimeiraCamada, 1)}cm` : "—"}
        </div>
      </div>
    </div>
  );
}

/* ---------- detalhe do estribo (dimensões para conferência) ---------- */

function EstriboDetalhe({ Bw, H, cob, coberturaTracaoCm, coberturaCompressaoCm, phiEstriboCm, phiEstriboMm, nRamos, sCm }) {
  const bw = Number(Bw) || 1, h = Number(H) || 1, c = Number(cob) || 0;
  const ramos = Number(nRamos) || 2;
  const numEstribos = Math.max(1, Math.round(ramos / 2));
  const alturaEstribo = Math.max(0, h - coberturaTracaoCm - coberturaCompressaoCm);
  // todos os estribos são idênticos (mesma largura, mesma bitola) — com mais de 2 ramos, são
  // simplesmente montados 2 a 2 (coincidentes), como confirmado na prática do escritório
  const larguraEstribo = Math.max(0, larguraEstriboCalc(bw, c, numEstribos));

  const maxW = 130, maxH = 220;
  const scale = Math.min(maxW / Math.max(larguraEstribo, 1), maxH / Math.max(alturaEstribo, 1));
  const ox = 40, oy = 26;
  const wPx = larguraEstribo * scale, hPx = alturaEstribo * scale;
  const passoOffset = numEstribos > 1 ? 4 : 0; // px de deslocamento visual entre estribos idênticos, só pra dar pra distinguir no desenho

  const svgW = ox + wPx + (numEstribos - 1) * passoOffset + 70;
  const svgH = oy + hPx + 40;

  return (
    <div className="w-full rounded-lg p-4" style={{ background: "var(--paper)", border: "1px solid var(--rule)" }}>
      <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>
        Detalhe do estribo {numEstribos > 1 ? `— ${numEstribos} estribos Ø${phiEstriboMm} iguais (${nRamos} ramos)` : `— 1 estribo Ø${phiEstriboMm} (${nRamos} ramos)`}
      </div>
      <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full max-w-[220px] mx-auto" role="img" aria-label="Detalhe do estribo com dimensões">
        {Array.from({ length: numEstribos }).map((_, k) => {
          const x = ox + k * passoOffset;
          const y = oy + k * passoOffset;
          return (
            <g key={k}>
              <rect x={x} y={y} width={wPx} height={hPx} rx="4" fill="none" stroke="var(--blue)" strokeWidth={k === 0 ? 1.8 : 1.4} strokeDasharray={k === 0 ? "0" : "3 2"} />
              <circle cx={x + 4} cy={y} r="2.6" fill="var(--blue)" />
              <circle cx={x + wPx - 4} cy={y} r="2.6" fill="var(--blue)" />
            </g>
          );
        })}
        {/* cota da largura */}
        <line x1={ox} y1={oy + hPx + (numEstribos - 1) * passoOffset + 14} x2={ox + wPx} y2={oy + hPx + (numEstribos - 1) * passoOffset + 14} stroke="var(--ink-soft)" strokeWidth="1" />
        <text x={ox + wPx / 2} y={oy + hPx + (numEstribos - 1) * passoOffset + 26} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--ink)" fontFamily="'IBM Plex Mono', monospace">{fmt(larguraEstribo, 1)}cm</text>
        {/* cota da altura */}
        <line x1={ox - 14} y1={oy} x2={ox - 14} y2={oy + hPx} stroke="var(--ink-soft)" strokeWidth="1" />
        <text x={ox - 20} y={oy + hPx / 2} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--ink)" fontFamily="'IBM Plex Mono', monospace" transform={`rotate(-90 ${ox - 20} ${oy + hPx / 2})`}>{fmt(alturaEstribo, 1)}cm</text>
      </svg>
      <div className="text-[11px] mt-2 space-y-0.5" style={{ color: "var(--ink-soft)", fontFamily: "'IBM Plex Mono', monospace" }}>
        <div>Largura (todos os estribos) = {numEstribos <= 1 ? "Bw − 2×cobrimento" : bw > 30 ? `(Bw − cobrimento) × ${numEstribos === 2 ? "4/6" : `3/${2 * numEstribos + 1}`}` : "Bw − 2×cobrimento"} = {fmt(larguraEstribo, 1)}cm</div>
        <div>Altura = H − coberturas (topo/base) = {fmt(alturaEstribo, 1)}cm</div>
        {numEstribos > 1 && <div>Estribos idênticos (mesma largura e bitola).</div>}
        <div>Espaçamento adotado: c/ {sCm}cm</div>
      </div>
    </div>
  );
}

/* ---------- diagrama do furo na alma ---------- */

function FuroDiagrama({ H, Bw, furoTopo, furoBase, zonaTopo, zonaBase, posicaoOk }) {
  const h = Number(H) || 1, bw = Number(Bw) || 1;
  const maxH = 220, larguraDesenho = 60;
  const scale = maxH / h;
  const ht = h * scale;
  const ox = 30, oy = 20;
  const wPx = larguraDesenho;

  const yZonaTopo = oy + zonaTopo * scale;
  const yZonaBase = oy + zonaBase * scale;
  const yFuroTopo = oy + furoTopo * scale;
  const yFuroBase = oy + furoBase * scale;
  const corFuro = posicaoOk ? "var(--green)" : "var(--red)";

  const svgW = ox + wPx + 90, svgH = oy + ht + 20;

  return (
    <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full max-w-[210px] mx-auto" role="img" aria-label="Elevação esquemática com a posição do furo">
      {/* contorno da viga */}
      <rect x={ox} y={oy} width={wPx} height={ht} fill="var(--panel)" stroke="var(--ink)" strokeWidth="1.6" />
      {/* zona permitida (entre LN e a última camada) */}
      <rect x={ox} y={yZonaTopo} width={wPx} height={Math.max(0, yZonaBase - yZonaTopo)} fill="var(--green)" opacity="0.08" />
      <line x1={ox} y1={yZonaTopo} x2={ox + wPx} y2={yZonaTopo} stroke="var(--green)" strokeWidth="1" strokeDasharray="3 2" />
      <line x1={ox} y1={yZonaBase} x2={ox + wPx} y2={yZonaBase} stroke="var(--green)" strokeWidth="1" strokeDasharray="3 2" />
      <text x={ox + wPx + 4} y={yZonaTopo + 3} fontSize="8" fill="var(--green)" fontFamily="'IBM Plex Mono', monospace">LN</text>
      {/* furo */}
      <rect x={ox + 4} y={yFuroTopo} width={wPx - 8} height={Math.max(0, yFuroBase - yFuroTopo)} fill="var(--paper)" stroke={corFuro} strokeWidth="1.8" />
      <line x1={ox + 4} y1={yFuroTopo} x2={ox + wPx - 4} y2={yFuroBase} stroke={corFuro} strokeWidth="1" />
      <line x1={ox + 4} y1={yFuroBase} x2={ox + wPx - 4} y2={yFuroTopo} stroke={corFuro} strokeWidth="1" />
      {/* cotas acima/abaixo */}
      <line x1={ox - 6} y1={oy} x2={ox - 6} y2={yFuroTopo} stroke="var(--ink-soft)" strokeWidth="1" />
      <text x={ox - 9} y={(oy + yFuroTopo) / 2} textAnchor="middle" fontSize="8" fill="var(--ink-soft)" fontFamily="'IBM Plex Mono', monospace" transform={`rotate(-90 ${ox - 9} ${(oy + yFuroTopo) / 2})`}>acima</text>
      <line x1={ox - 6} y1={yFuroBase} x2={ox - 6} y2={oy + ht} stroke="var(--ink-soft)" strokeWidth="1" />
      <text x={ox - 9} y={(yFuroBase + oy + ht) / 2} textAnchor="middle" fontSize="8" fill="var(--ink-soft)" fontFamily="'IBM Plex Mono', monospace" transform={`rotate(-90 ${ox - 9} ${(yFuroBase + oy + ht) / 2})`}>abaixo</text>
      <text x={ox + wPx / 2} y={oy + ht + 14} textAnchor="middle" fontSize="8.5" fill="var(--ink-soft)" fontFamily="'IBM Plex Mono', monospace">Bw={bw}cm</text>
    </svg>
  );
}

/* ---------- diagrama de deformações e equilíbrio ---------- */

function DiagramaEquilibrio({ momentoNegativo, xCm, xRedCm, epsC, epsS, forcaTf, d, alfac, etac }) {
  if (!Number.isFinite(xCm) || !Number.isFinite(d) || d <= 0) return null;

  const topoY = 26, baseY = 176; // limites verticais do esquema (não é escala real da viga)
  const htPx = baseY - topoY;
  // quando o momento é negativo, a compressão fica embaixo e a tração em cima — inverte o desenho
  const faceCompY = momentoNegativo ? baseY : topoY;
  const faceTracY = momentoNegativo ? topoY : baseY;
  const dir = momentoNegativo ? -1 : 1;
  const lnY = faceCompY + dir * Math.min(1, Math.max(0, xCm / d)) * htPx;

  const eixoX = 130; // eixo de deformação nula
  const compW = 26; // largura esquemática do triângulo de compressão (não proporcional a epsC)
  const tracW = 36; // largura esquemática da reta de tração (não proporcional a epsS)

  const secX = 20, secW = 36;
  const dCotaX = 80;
  const tenX = 210, tenW = 32; // bloco de tensões
  const blocoAltura = Math.max(5, (xRedCm / d) * htPx);
  const blocoY = momentoNegativo ? baseY - blocoAltura : topoY;
  const asY = faceTracY + (momentoNegativo ? 6 : -6); // linha do As, um pouco para dentro da face tracionada
  const svgW = 320, svgH = 196;
  const fatorTensao = alfac * etac;
  const compLabelY = momentoNegativo ? baseY - 4 : topoY + 9;
  const tracLabelY = momentoNegativo ? topoY + 9 : baseY - 4;

  return (
    <div className="w-full rounded-lg p-4" style={{ background: "var(--paper)", border: "1px solid var(--rule)" }}>
      {momentoNegativo && (
        <div className="text-[10px] font-semibold mb-2" style={{ color: "var(--amber)" }}>
          Momento negativo — compressão embaixo e tração em cima (invertido em relação ao caso usual)
        </div>
      )}
      <div className="grid md:grid-cols-[auto_1fr] gap-5 items-center">
        <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full max-w-[300px] mx-auto flex-shrink-0" role="img" aria-label="Diagrama de deformações e equilíbrio">
          <defs>
            <pattern id="hachura" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="6" stroke="var(--rule-strong)" strokeWidth="1.2" />
            </pattern>
            <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--blue)" /></marker>
            <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--red-brand, var(--red))" /></marker>
          </defs>

          {/* coluna 1: seção */}
          <rect x={secX} y={topoY} width={secW} height={htPx} fill="url(#hachura)" stroke="var(--ink)" strokeWidth="1.4" />
          <rect x={secX} y={topoY} width={secW} height={htPx} fill="none" stroke="var(--ink)" strokeWidth="1.4" />
          <line x1={secX + 3} y1={asY} x2={secX + secW - 3} y2={asY} stroke="var(--red-brand, var(--red))" strokeWidth="3" strokeLinecap="round" />

          {/* cota d */}
          <line x1={dCotaX} y1={topoY} x2={dCotaX} y2={baseY} stroke="var(--ink-soft)" strokeWidth="1" />
          <line x1={dCotaX - 3} y1={topoY} x2={dCotaX + 3} y2={topoY} stroke="var(--ink-soft)" strokeWidth="1" />
          <line x1={dCotaX - 3} y1={baseY} x2={dCotaX + 3} y2={baseY} stroke="var(--ink-soft)" strokeWidth="1" />
          <text x={dCotaX - 7} y={(topoY + baseY) / 2} textAnchor="middle" fontSize="9" fontWeight="600" fill="var(--ink)" fontFamily="'IBM Plex Mono', monospace" transform={`rotate(-90 ${dCotaX - 7} ${(topoY + baseY) / 2})`}>d</text>

          {/* coluna 2: deformações — uma reta contínua que cruza a LN (decomposta em 2 trechos coloridos) */}
          <line x1={eixoX} y1={topoY} x2={eixoX} y2={baseY} stroke="var(--ink-soft)" strokeWidth="1" strokeDasharray="2 2" />
          <line x1={eixoX - tracW - 6} y1={lnY} x2={tenX + tenW + 6} y2={lnY} stroke="var(--green)" strokeWidth="1.2" strokeDasharray="4 2" />
          <text x={tenX + tenW + 9} y={lnY + 3} fontSize="9" fontWeight="700" fill="var(--green)" fontFamily="'IBM Plex Mono', monospace">LN</text>

          <polygon points={`${eixoX},${lnY} ${eixoX + compW},${faceCompY} ${eixoX},${faceCompY}`} fill="var(--blue)" opacity="0.22" stroke="var(--blue)" strokeWidth="1.3" strokeLinejoin="round" />
          <line x1={eixoX} y1={lnY} x2={eixoX - tracW} y2={faceTracY} stroke="var(--red-brand, var(--red))" strokeWidth="1.6" strokeLinecap="round" />
          <circle cx={eixoX - tracW} cy={faceTracY} r="2.6" fill="var(--red-brand, var(--red))" />
          <text x={eixoX + compW + 3} y={compLabelY} fontSize="9" fontWeight="700" fill="var(--blue)" fontFamily="'IBM Plex Mono', monospace">εc</text>
          <text x={eixoX - tracW - 3} y={tracLabelY} textAnchor="end" fontSize="9" fontWeight="700" fill="var(--red-brand, var(--red))" fontFamily="'IBM Plex Mono', monospace">εs</text>

          {/* coluna 3: bloco de tensões e forças */}
          <rect x={tenX} y={blocoY} width={tenW} height={blocoAltura} fill="var(--blue)" stroke="var(--blue)" strokeWidth="1" />
          <line x1={tenX + tenW + 52} y1={blocoY + blocoAltura / 2} x2={tenX + tenW + 20} y2={blocoY + blocoAltura / 2} stroke="var(--blue)" strokeWidth="1.8" markerEnd="url(#arrowBlue)" />
          <text x={tenX + tenW + 24} y={blocoY + blocoAltura / 2 - 5} fontSize="9" fontWeight="700" fill="var(--blue)" fontFamily="'IBM Plex Mono', monospace">Rcc</text>
          <line x1={secX} y1={asY} x2={secX - 26} y2={asY} stroke="var(--red-brand, var(--red))" strokeWidth="1.8" markerEnd="url(#arrowRed)" transform={`rotate(180 ${secX - 13} ${asY})`} />
        </svg>

        {/* legenda com os valores — fora do SVG para ficar legível */}
        <div className="grid grid-cols-2 gap-x-4 gap-y-2 text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
          <div><span style={{ color: "var(--ink-soft)" }}>d (útil):</span> <strong style={{ color: "var(--ink)" }}>{fmt(d, 1)}cm</strong></div>
          <div><span style={{ color: "var(--ink-soft)" }}>x (LN):</span> <strong style={{ color: "var(--ink)" }}>{fmt(xCm, 1)}cm</strong></div>
          <div><span style={{ color: "var(--blue)" }}>εc (concreto):</span> <strong style={{ color: "var(--blue)" }}>{fmt(epsC, 2)}‰</strong></div>
          <div><span style={{ color: "var(--red-brand, var(--red))" }}>εs (aço):</span> <strong style={{ color: "var(--red-brand, var(--red))" }}>{fmt(epsS, 2)}‰</strong></div>
          <div><span style={{ color: "var(--ink-soft)" }}>0,8x (bloco):</span> <strong style={{ color: "var(--ink)" }}>{fmt(xRedCm, 1)}cm</strong></div>
          <div><span style={{ color: "var(--ink-soft)" }}>tensão no bloco:</span> <strong style={{ color: "var(--ink)" }}>{fmt(fatorTensao, 2)}·fcd</strong></div>
          <div><span style={{ color: "var(--blue)" }}>Rcc (compressão):</span> <strong style={{ color: "var(--blue)" }}>{fmt(forcaTf, 2)} tf</strong></div>
          <div><span style={{ color: "var(--red-brand, var(--red))" }}>Rst (tração):</span> <strong style={{ color: "var(--red-brand, var(--red))" }}>{fmt(forcaTf, 2)} tf</strong></div>
        </div>
      </div>
    </div>
  );
}

/* ---------- main ---------- */

function CalculadoraViga() {
  const [Bw, setBw] = useState(18);
  const [H, setH] = useState(70);
  const [cob, setCob] = useState(3);
  const [fck, setFck] = useState(30);
  const [fyk, setFyk] = useState(500);
  const [Mk, setMk] = useState(0);
  const [Vk, setVk] = useState(0);
  const [Nk, setNk] = useState(0);
  const [Tk, setTk] = useState(0);
  const [phiFlexao, setPhiFlexao] = useState("16");
  const [phiEstribo, setPhiEstribo] = useState(6.3);
  const [nRamos, setNRamos] = useState(2);
  const [phiPele, setPhiPele] = useState("8");
  const [phiTorcao, setPhiTorcao] = useState("10");
  const [alturaFuro, setAlturaFuro] = useState(0);
  const [cotaFuroTopo, setCotaFuroTopo] = useState(0);
  const [larguraFuro, setLarguraFuro] = useState(0);
  const [cargaSuspensa, setCargaSuspensa] = useState(0);
  const [alturaSuspensa, setAlturaSuspensa] = useState(0);
  const [larguraApoio, setLarguraApoio] = useState(0);
  const [momentoApoioPilar, setMomentoApoioPilar] = useState(0);
  const [larguraApoioViga, setLarguraApoioViga] = useState(0);
  const [phiGrampo, setPhiGrampo] = useState("8");
  const [phiFuro, setPhiFuro] = useState("10");
  const [phiFuroInferior, setPhiFuroInferior] = useState("10");
  const [qtdPortaEstribo, setQtdPortaEstribo] = useState(2);
  const [phiPortaEstribo, setPhiPortaEstribo] = useState("10");

  const r = useMemo(() => {
    const num = (x) => (typeof x === "number" && Number.isFinite(x) ? x : NaN);
    const bw = num(Bw), h = num(H), c = num(cob);
    const fckv = num(fck), fykv = num(fyk), mk = num(Mk), vk = num(Vk), nk = num(Nk), tk = num(Tk);
    const ramos = num(nRamos);
    const estriboCm = num(Number(phiEstribo)) / 10;

    // --- Validação de geometria — bloqueia o cálculo com mensagem clara em vez de propagar NaN silenciosamente ---
    const geometriaErros = [];
    if (!(bw > 0)) geometriaErros.push(`Bw (base) deve ser maior que 0 — valor atual: ${Number.isFinite(bw) ? bw : "—"}cm.`);
    if (!(h > 0)) geometriaErros.push(`H (altura) deve ser maior que 0 — valor atual: ${Number.isFinite(h) ? h : "—"}cm.`);
    if (Number.isFinite(c) && c < 0) geometriaErros.push(`Cobrimento não pode ser negativo — valor atual: ${c}cm.`);
    if (Number.isFinite(c) && Number.isFinite(h) && h > 0 && c > h / 2) geometriaErros.push(`Cobrimento (${c}cm) não pode exceder H/2 (${(h / 2).toFixed(1)}cm) — não sobraria espaço útil para a armadura.`);
    if (geometriaErros.length > 0) {
      return { geometriaErros };
    }

    const opFlexao = OPCOES_FLEXAO.find((o) => o.value === phiFlexao) || OPCOES_FLEXAO[3];
    const diamFlexaoCm = opFlexao.diamCm;
    const areaFlexaoUnit = (Math.PI * diamFlexaoCm * diamFlexaoCm) / 4 * (opFlexao.feixe ? 2 : 1);
    const larguraUnidadeFlexao = opFlexao.feixe ? 2 * diamFlexaoCm : diamFlexaoCm;

    // momento negativo: armadura de tração fica na face superior; a face superior do estribo
    // tem 2cm a mais de folga vertical (cobrimento efetivo do estribo no topo = cobrimento + 2cm)
    const momentoNegativo = mk < 0;
    const mkAbs = Math.abs(mk);
    const coberturaTracao = momentoNegativo ? c + 2 : c;
    const coberturaCompressao = momentoNegativo ? c : c + 2;

    // espaçamento vertical entre camadas (NBR 6118: >= diam e >= 2cm)
    const espVert = 2; // cm — folga vertical mínima entre camadas

    // --- Alojamento da armadura: largura disponível e capacidade por camada ---
    // largura disponível = base - 2*cobrimento - (nº de posições distintas de perna × Ø estribo), com folga mínima de 6cm entre barras (horizontal).
    // Para Bw ≤ 30cm os estribos extras são montados juntos, coincidentes com as 2 pernas originais (mesmo alinhamento) —
    // por isso descontam só 2 pernas, não uma por ramo.
    const folgaMinBarras = 6; // cm — folga horizontal mínima entre barras
    const pernasNaLargura = bw <= 30 ? 2 : ramos;
    const larguraDisponivel = bw - 2 * c - pernasNaLargura * estriboCm;
    const vigaEstreita = bw >= 14 && bw <= 18; // vigas de 14 a 18cm: garante ao menos 2 barras por camada
    const porCamadaCalculado = Math.max(1, Math.floor((larguraDisponivel + folgaMinBarras) / (larguraUnidadeFlexao + folgaMinBarras)));
    const maxPorCamada = vigaEstreita ? Math.max(2, porCamadaCalculado) : porCamadaCalculado;

    // bitola própria para a armadura longitudinal de torção (quando não coincide com a compressão de flexão)
    const opTorcao = OPCOES_TORCAO.find((o) => o.value === phiTorcao) || OPCOES_TORCAO[1];
    const diamTorcaoCm = opTorcao.diamCm;
    const areaTorcaoUnit = (Math.PI * diamTorcaoCm * diamTorcaoCm) / 4;
    const porCamadaTorcaoCalc = Math.max(1, Math.floor((larguraDisponivel + folgaMinBarras) / (diamTorcaoCm + folgaMinBarras)));
    const maxPorCamadaTorcao = vigaEstreita ? Math.max(2, porCamadaTorcaoCalc) : porCamadaTorcaoCalc;

    const distribuirEmCamadas = (n) => {
      const linhas = [];
      let restante = n;
      const nCamadas = Math.max(1, Math.ceil(n / maxPorCamada));
      for (let i = 0; i < nCamadas; i++) {
        const nesta = Math.min(maxPorCamada, restante);
        linhas.push(nesta);
        restante -= nesta;
      }
      return linhas;
    };

    // distância da face tracionada até o centro de cada camada i (i=0 é a camada mais próxima da face)
    const yCamada = (i) => coberturaTracao + estriboCm + diamFlexaoCm / 2 + i * (espVert + diamFlexaoCm);
    // d' = centroide das armaduras, ponderado pelo nº de barras de cada camada
    const centroideDLinha = (linhas) => {
      let somaN = 0, somaNY = 0;
      linhas.forEach((n, i) => { somaN += n; somaNY += n * yCamada(i); });
      return somaN > 0 ? somaNY / somaN : coberturaTracao + estriboCm + diamFlexaoCm / 2;
    };

    const fcd = fckv / 1.4;
    const lambda = fckv <= 50.01 ? 0.8 : 0.8 - (fckv - 50) / 400;
    const alfac = fckv <= 50.01 ? 0.85 : 0.85 * (1 - (fckv - 50) / 200);
    const etac = fckv <= 40.01 ? 1 : Math.pow(40 / fckv, 1 / 3);
    const fydCm2 = (fykv / 10) / 1.15;

    // Wo, fctm, fctkSup e As,mín não dependem de d — calculados uma vez
    const Wo = ((bw / 100) * Math.pow(h / 100, 2)) / 6;
    const fctm = fckv <= 50.01 ? 0.3 * Math.pow(fckv, 2 / 3) : 2.12 * Math.log(1 + (fckv + 8) * 0.1);
    const fctkSup = 1.3 * fctm;
    const asMin = (rhoMinPorFck(fckv) / 100) * bw * h;

    // Asl (torção) calculado com uma estimativa inicial de d' (efeito de d' sobre a torção é secundário e não é reiterado)
    const dLinhaInicial = coberturaTracao + estriboCm + diamFlexaoCm / 2;
    const AsobreU = (bw / 100 * (h / 100)) / (2 * ((bw + h) / 100));
    const doisC1 = 2 * (dLinhaInicial / 100);
    const limiteSupHe = bw / 100 - doisC1;
    const heValido = doisC1 <= limiteSupHe;
    const he = heValido ? Math.min(Math.max(AsobreU, doisC1), limiteSupHe) : doisC1;
    const Ae = Math.max(0, (bw / 100 - he) * (h / 100 - he));
    const ue = 2 * ((bw / 100 - he) + (h / 100 - he));
    const tkAbs = Math.abs(tk);
    const Tsd = tkAbs * 10 * 1.4; // kN.m
    const Trd2 = 0.5 * (1 - fckv / 250) * he * Ae * (fcd * 1000); // kN.m
    const torcaoOk = tk !== 0 ? Tsd < Trd2 : null;
    const As90 = tk !== 0 ? Tsd / (2 * Ae * fydCm2) : 0; // cm²/m
    const Asl = tk !== 0 ? (Tsd * ue) / (2 * Ae * fydCm2) : 0; // cm² — total ao longo de todo o perímetro ue

    // distribuição do Asl pelas 4 faces do núcleo (proporcional ao comprimento de cada face), conforme NBR 6118 17.5.1.2
    const faceHorizontal = Math.max(0, bw / 100 - he); // face superior/inferior (m)
    const faceVertical = Math.max(0, h / 100 - he); // face lateral, cada uma (m)
    const aslPorMetro = ue > 0 ? Asl / ue : 0; // cm²/m de perímetro
    const aslFaceH = aslPorMetro * faceHorizontal; // cm² — em cada face horizontal (topo OU base, isoladamente)
    const aslFaceV = aslPorMetro * faceVertical; // cm² — em cada face lateral (esquerda OU direita, isoladamente)

    // --- Iteração: converge d' considerando o centro real do alojamento das barras ---
    let dLinha = dLinhaInicial;
    let kmd, kx, dupla, kz, asTracao, mdMin, asCalcMin, asGovernanteTracao, nCertoTracao, linhasTracao;
    let d = h - dLinha;
    const dLinhaComp1 = coberturaCompressao + estriboCm + diamFlexaoCm / 2; // distância da face comprimida até a 1ª camada de compressão (não depende de d, fica fora do loop)
    for (let iter = 0; iter < 8; iter++) {
      d = h - dLinha;
      const Yt = d - 0.5 * h;
      const msdCor = (mkAbs + nk * (Yt / 100)) * 1.4;
      const denomSecao = (bw / 100) * Math.pow(d / 100, 2) * (fcd * 1000);
      kmd = (msdCor * 10) / denomSecao;
      const raizKx = 1 - (2 * kmd) / (alfac * etac);
      kx = raizKx >= 0 ? (1 - Math.sqrt(raizKx)) / lambda : NaN;
      // dupla é decidido por kmd vs kmdLim (usando o kx,lim fixo de 0,45 ou 0,35) — não pelo kx bruto/irrestrito,
      // que fica NaN pra momentos bem acima da capacidade simples mesmo quando a dupla ainda resolve perfeitamente
      const fatorLim = fckv <= 50.01 ? 0.45 : 0.35;
      const kzLimCheck = 1 - (lambda / 2) * fatorLim;
      const kmdLimCheck = lambda * fatorLim * alfac * etac * kzLimCheck;
      dupla = kmd > kmdLimCheck;
      kz = 1 - (lambda / 2) * kx;
      asTracao = (msdCor * 10) / (kz * (d / 100) * fydCm2);

      mdMin = 0.8 * Wo * (fctkSup * 1000);
      const kmdMin = mdMin / denomSecao;
      const raizKxMin = 1 - (2 * kmdMin) / (alfac * etac);
      const kxMin = raizKxMin >= 0 ? (1 - Math.sqrt(raizKxMin)) / lambda : NaN;
      const kzMin = 1 - (lambda / 2) * kxMin;
      asCalcMin = mdMin / ((d / 100) * kzMin * fydCm2);

      // As de tração efetivo p/ contagem de barras: se precisa de dupla, usa a soma correta As1(Mlim)+As2(M2)
      // — não a fórmula "simples" extrapolada além do domínio válido, que fica inválida/NaN em momentos bem
      // acima da capacidade sem dupla (o que antes fazia o app subdimensionar silenciosamente nesses casos)
      let asTracaoEfetivo;
      if (dupla) {
        const mLimLoop = kmdLimCheck * denomSecao;
        const m2Loop = msdCor * 10 - mLimLoop;
        const zLinhaLoop = h - dLinha - dLinhaComp1;
        const asTracaoDuplaLoop = mLimLoop / (kzLimCheck * (d / 100) * fydCm2);
        const asCompressaoLoop = zLinhaLoop > 0 ? m2Loop / ((zLinhaLoop / 100) * fydCm2) : NaN;
        asTracaoEfetivo = asTracaoDuplaLoop + (Number.isFinite(asCompressaoLoop) ? asCompressaoLoop : 0);
      } else {
        asTracaoEfetivo = Number.isFinite(asTracao) ? asTracao : 0;
      }

      asGovernanteTracao = Math.max(asTracaoEfetivo + aslFaceH, asMin);
      nCertoTracao = Math.ceil(asGovernanteTracao / areaFlexaoUnit);
      linhasTracao = distribuirEmCamadas(nCertoTracao);
      const novoDLinha = centroideDLinha(linhasTracao);

      if (Math.abs(novoDLinha - dLinha) < 0.001) { dLinha = novoDLinha; break; }
      dLinha = novoDLinha;
    }
    const asProvTracao = nCertoTracao * areaFlexaoUnit;
    const camadasTracao = linhasTracao.length;
    const nPrimeiraCamada = linhasTracao[0] || 0;
    const folgaPrimeiraCamada = nPrimeiraCamada > 1
      ? (larguraDisponivel - nPrimeiraCamada * larguraUnidadeFlexao) / (nPrimeiraCamada - 1)
      : NaN;

    // --- Alternativa: quando o uso de feixes deixa a folga da 1ª camada apertada (<6cm), pode-se montar
    // 2 feixes na vertical (um Ø sobre o outro, na mesma posição horizontal) em vez de vários feixes lado a
    // lado — isso libera espaço horizontal na 1ª camada. Se essa dupla vertical não bastar sozinha, complementa
    // com 1 ou 2 barras soltas (não em feixe) numa 2ª camada. Só vale quando o As necessário efetivamente
    // cabe nesse envelope (2 feixes + até 2 barras soltas) — não é aplicável se precisar de mais aço que isso.
    let feixeVerticalAlt = null;
    if (opFlexao.feixe && (!Number.isFinite(folgaPrimeiraCamada) || folgaPrimeiraCamada < 6)) {
      const areaBarraSolta = areaFlexaoUnit / 2; // área de 1 barra Ø avulsa (sem feixe)
      const as2Feixes = 2 * areaFlexaoUnit; // 2 feixes verticais na 1ª camada = 4 barras no total
      const as2FeixesMais1 = as2Feixes + areaBarraSolta;
      const as2FeixesMais2 = as2Feixes + 2 * areaBarraSolta;
      if (asGovernanteTracao <= as2FeixesMais2) {
        // folga horizontal com só 1 posição ocupada na 1ª camada (os 2 feixes empilhados na vertical, mesma coluna)
        const folgaComVertical = larguraDisponivel - larguraUnidadeFlexao; // toda a largura livre sobra numa única coluna
        feixeVerticalAlt = {
          areaBarraSolta, as2Feixes, as2FeixesMais1, as2FeixesMais2, folgaComVertical,
          opcao1Ok: as2Feixes >= asGovernanteTracao,
          opcao2Ok: as2FeixesMais1 >= asGovernanteTracao,
          opcao3Ok: as2FeixesMais2 >= asGovernanteTracao,
        };
      }
    }

    // --- Comprimento de ancoragem da armadura de flexão adotada (NBR 6118 9.4) ---
    const diamFlexaoMm = diamFlexaoCm * 10;
    const fctdAncoragem = (0.7 * fctm) / 1.4; // MPa
    const eta1 = 2.25; // barra nervurada (CA-50/CA-60/CA-70)
    const eta3 = diamFlexaoMm < 32 ? 1.0 : (132 - diamFlexaoMm) / 100;
    const fbdBoa = eta1 * 1.0 * eta3 * fctdAncoragem;
    const fbdMa = eta1 * 0.7 * eta3 * fctdAncoragem;
    const fydMPa = fykv / 1.15;
    const lbBoa = (diamFlexaoMm / 4) * (fydMPa / fbdBoa) / 10; // cm
    const lbMa = (diamFlexaoMm / 4) * (fydMPa / fbdMa) / 10; // cm
    const lbMinBoa = Math.max(0.3 * lbBoa, 10 * diamFlexaoCm, 10);
    const lbMinMa = Math.max(0.3 * lbMa, 10 * diamFlexaoCm, 10);
    const razaoAsCalcEf = asProvTracao > 0 ? Math.min(1, asGovernanteTracao / asProvTracao) : 1;
    const comprimentoGancho = 8 * diamFlexaoCm; // cm — trecho reto final do gancho (valor prático usual, CA-50/60/70)
    const raioDobra = diamFlexaoMm < 20 ? 2.5 * diamFlexaoCm : 4 * diamFlexaoCm; // cm — raio interno de curvatura (NBR 6118, CA-50)
    const ancoragem = {
      diamMm: diamFlexaoMm, lbBoa, lbMa, razaoAsCalcEf, comprimentoGancho, raioDobra,
      retoBoa: Math.max(lbBoa * 1.0 * razaoAsCalcEf, lbMinBoa),
      retoMa: Math.max(lbMa * 1.0 * razaoAsCalcEf, lbMinMa),
      ganchoBoa: Math.max(lbBoa * 0.7 * razaoAsCalcEf, lbMinBoa),
      ganchoMa: Math.max(lbMa * 0.7 * razaoAsCalcEf, lbMinMa),
    };

    // --- Diagrama de deformações e equilíbrio (domínios 2 e 3) ---
    const ecu = 3.5; // ‰ — deformação de ruptura do concreto (fck ≤ 50MPa)
    const x23 = ecu / (ecu + 10); // limite entre domínio 2 e 3 (≈0,259)
    const xCm = Number.isFinite(kx) ? kx * d : NaN;
    const xRedCm = Number.isFinite(xCm) ? lambda * xCm : NaN; // 0,8x (bloco retangular equivalente)
    let epsC, epsS;
    if (!Number.isFinite(kx)) { epsC = NaN; epsS = NaN; }
    else if (kx <= x23) { epsS = 10; epsC = 10 * (kx / (1 - kx)); }
    else { epsC = ecu; epsS = ecu * (1 - kx) / kx; }
    const forcaTf = Number.isFinite(asTracao) ? (asTracao * fydCm2) / 10 : NaN; // Rst = Rcc no ELU, em tf

    // --- Armadura dupla (usa d e d' já convergidos) ---
    let duplaCalc = null;
    if (dupla) {
      const fator = fckv <= 50.01 ? 0.45 : 0.35;
      const kzLim = 1 - (lambda / 2) * fator;
      const kmdLim = lambda * fator * alfac * etac * kzLim;
      const denomSecao = (bw / 100) * Math.pow(d / 100, 2) * (fcd * 1000);
      const mLim = kmdLim * denomSecao;
      const m2 = mkAbs * 1.4 * 10 - mLim;
      const zLinha = h - dLinha - dLinhaComp1;
      const asTracaoDupla = mLim / (kzLim * (d / 100) * fydCm2);
      const asCompressao = m2 / ((zLinha / 100) * fydCm2);
      duplaCalc = { kzLim, kmdLim, mLim, m2, zLinha, asTracao: asTracaoDupla, asCompressao };
    }

    // face de compressão: soma a necessidade da flexão (se dupla) com a parcela de torção daquela face (aslFaceH).
    // Quando não há armadura dupla, a face de compressão é puramente de torção e usa a bitola própria de torção.
    const asCompressaoTorcao = tk !== 0 ? aslFaceH : 0;
    const asCompressaoTotal = (dupla && duplaCalc ? duplaCalc.asCompressao : 0) + asCompressaoTorcao;
    let compCalc = null;
    if (asCompressaoTotal > 0) {
      const usaTorcaoBitola = !dupla; // só torção presente nesta face
      const areaUnitComp = usaTorcaoBitola ? areaTorcaoUnit : areaFlexaoUnit;
      const maxPorCamadaComp = usaTorcaoBitola ? maxPorCamadaTorcao : maxPorCamada;
      const nCertoComp = Math.ceil(asCompressaoTotal / areaUnitComp);
      const asProvComp = nCertoComp * areaUnitComp;
      const linhasCompCalc = [];
      let restanteComp = nCertoComp;
      const nCamadasComp = Math.max(1, Math.ceil(nCertoComp / maxPorCamadaComp));
      for (let i = 0; i < nCamadasComp; i++) {
        const nesta = Math.min(maxPorCamadaComp, restanteComp);
        linhasCompCalc.push(nesta);
        restanteComp -= nesta;
      }
      compCalc = {
        nCertoComp, asProvComp, unitsPerLayerComp: maxPorCamadaComp, camadasComp: linhasCompCalc.length,
        viaFlexao: dupla, asCompressaoTorcao, opBitola: usaTorcaoBitola ? opTorcao : opFlexao,
      };
    }

    // --- Taxa máxima de armadura longitudinal (NBR 6118 17.3.5.2.4): As + As' ≤ 4% Ac (fora da região de emenda) ---
    const acBruta = bw * h; // cm²
    const asMax4 = 0.04 * acBruta; // cm²
    const asTotalAtual = asProvTracao + (compCalc ? compCalc.asProvComp : 0);
    const taxaAtual4 = acBruta > 0 ? (asTotalAtual / acBruta) * 100 : 0;
    const dentroTaxaMax4 = asTotalAtual <= asMax4;
    const margemPortaEstribo = Math.max(0, asMax4 - asTotalAtual); // cm² ainda disponíveis, ex. p/ barras porta-estribo

    // --- Armadura de pele (NBR 6118 17.3.5.2.1) — obrigatória para h > 60cm, 0,10% Ac,alma por face, s ≤ 20cm.
    // Quando há torção, a parcela lateral do Asl (aslFaceV) concorre com a armadura de pele na mesma face — adota-se a maior.
    // Sem torção, o mínimo de 0,10%Ac,alma não precisa ultrapassar 5cm² por face (limite prático usual).
    const peleObrigatoria = h > 60;
    const acAlma = bw * h; // cm²
    const peleMinPorFaceBruto = peleObrigatoria ? (0.10 / 100) * acAlma : 0; // cm²
    const peleMinPorFace = tk === 0 ? Math.min(peleMinPorFaceBruto, 5) : peleMinPorFaceBruto;
    const peleGovernantePorFace = Math.max(peleMinPorFace, tk !== 0 ? aslFaceV : 0);
    const opPele = OPCOES_PELE.find((o) => o.value === phiPele) || OPCOES_PELE[1];
    const areaPeleUnit = (Math.PI * opPele.diamCm * opPele.diamCm) / 4;
    let peleCalc = null;
    if (peleGovernantePorFace > 0) {
      const nPorArea = Math.ceil(peleGovernantePorFace / areaPeleUnit);
      const alturaUtilPele = Math.max(0, h - 2 * c); // altura disponível para distribuir a pele (aprox.)
      const nPorEspacamento = Math.max(1, Math.ceil(alturaUtilPele / 20) + 1); // s ≤ 20cm entre barras
      const nPorFace = Math.max(nPorArea, nPorEspacamento);
      const asProvPorFace = nPorFace * areaPeleUnit;
      const sReal = nPorFace > 1 ? alturaUtilPele / (nPorFace - 1) : alturaUtilPele;
      peleCalc = { nPorFace, asProvPorFace, sReal, viaTorcao: tk !== 0 && aslFaceV > peleMinPorFace, opPele, peleLimitada: tk === 0 && peleMinPorFaceBruto > 5 };
    }

    // --- Cisalhamento (usa o d final, já convergido pelo alojamento da flexão) ---
    const fctkInf = 0.7 * fctm;
    const vsd = vk * 1.4;
    const vRd2 = (0.27 * (1 - fckv / 250) * (fcd * 1000) * (bw / 100) * (d / 100)) / 10;
    const bielaOk = Number.isFinite(vRd2) ? vsd < vRd2 : null;
    const vc = (0.6 * ((fctkInf / 1.4) * 1000) * (bw / 100) * (d / 100)) / 10;

    // --- al: deslocamento do diagrama de força no banzo tracionado (NBR 6118 17.4.2.3) ---
    // al = d·[Vsd/(2·(Vsd−Vc))], limitado entre 0,5d e d — quando Vsd ≤ Vc (só armadura mínima), a fórmula não se aplica e adota-se al = 0,5d.
    const alCalc = vsd > vc ? d * (vsd / (2 * (vsd - vc))) : 0.5 * d;
    const al = Math.min(Math.max(alCalc, 0.5 * d), d);
    ancoragem.al = al;
    ancoragem.alFormulaAplicavel = vsd > vc;

    // --- Ancoragem no apoio (Pilar de extremidade) — NBR 6118 18.3.2.4 ---
    // Situação de aderência (NBR 9.3.1): momento negativo (tração no topo) com H≥60cm cai na região de má aderência
    // (mais de 30cm de concreto lançado abaixo da barra); nos demais casos (tração embaixo, ou H<60cm) é boa aderência.
    const larguraApoioV = num(larguraApoio);
    const momentoApoioPilarV = num(momentoApoioPilar);
    let apoioCalc = null;
    if (larguraApoioV > 0) {
      const lDisponivel = Math.max(0, larguraApoioV - c); // comprimento reto disponível a partir da face do apoio
      const aderenciaMa = momentoNegativo && h >= 60;

      const fbdApoio = eta1 * (aderenciaMa ? 0.7 : 1.0) * eta3 * fctdAncoragem;
      const lbApoio = (diamFlexaoMm / 4) * (fydMPa / fbdApoio) / 10; // cm

      // momento positivo no vão → apoio de extremidade (pilar) com momento nulo, salvo se o usuário informar um
      // momento de apoio diferente de zero (ex.: ligação viga-pilar com continuidade parcial)
      const apoioMomentoNulo = !momentoNegativo && momentoApoioPilarV === 0;

      let asCalcApoio, lbMinApoio;
      if (momentoNegativo) {
        // apoio com momento real (tração já calculada na flexão do vão)
        asCalcApoio = asGovernanteTracao;
        lbMinApoio = Math.max(0.3 * lbApoio, 10 * diamFlexaoCm, 10);
      } else if (momentoApoioPilarV !== 0) {
        // momento de apoio informado (ligação com continuidade parcial): fórmula geral —
        // Rsd = (al/d)·Vsd + Msd,apoio/d (o caso de momento nulo, do item 4, é só esta fórmula com Msd,apoio=0)
        const msdApoioKNm = Math.abs(momentoApoioPilarV) * 1.4 * 10; // tf·m → kN·m, com γf
        const rsdApoio9 = (al / d) * (vsd * 10) + msdApoioKNm / (d / 100); // kN — d em metros aqui
        asCalcApoio = Math.max(rsdApoio9 / fydCm2, asProvTracao / 3, 2 * areaFlexaoUnit);
        lbMinApoio = Math.max(8 * diamFlexaoCm, 6);
      } else {
        // apoio de extremidade, momento nulo: mesmas considerações do item 4 (força reduzida pelo deslocamento do diagrama)
        const asForcaApoio9 = (al / d) * ((vsd * 10) / fydCm2);
        asCalcApoio = Math.max(asForcaApoio9, asProvTracao / 3, 2 * areaFlexaoUnit);
        lbMinApoio = Math.max(8 * diamFlexaoCm, 6);
      }

      let lbNecRetoAtual, ancoraRetoOk, lbNecGanchoAtual, ancoraGanchoOk, cabeComMinimo, nMinGancho, verifNovo, grampoCalc;
      const nTotalApoio = nCertoTracao;

      if (momentoNegativo) {
        // apoio com momento real: mantém o fluxo original (informa reto/gancho, busca nº mínimo de barras com gancho, sem grampo)
        lbNecRetoAtual = Math.max(lbApoio * 1.0 * (asCalcApoio / asProvTracao), lbMinApoio);
        ancoraRetoOk = lDisponivel >= lbNecRetoAtual;
        lbNecGanchoAtual = Math.max(lbApoio * 0.7 * (asCalcApoio / asProvTracao), lbMinApoio);
        ancoraGanchoOk = lDisponivel >= lbNecGanchoAtual;
        cabeComMinimo = lDisponivel >= lbMinApoio;
        nMinGancho = cabeComMinimo
          ? Math.max(nCertoTracao, Math.ceil((lbApoio * 0.7 * asCalcApoio) / (areaFlexaoUnit * lDisponivel)))
          : null;
        grampoCalc = null;

        if (nMinGancho) {
          const linhasNovo = distribuirEmCamadas(nMinGancho);
          const dLinhaNovo = centroideDLinha(linhasNovo);
          const dNovo = h - dLinhaNovo;
          const asProvNovo = nMinGancho * areaFlexaoUnit;
          const YtNovo = dNovo - 0.5 * h;
          const msdCorNovo = (mkAbs + nk * (YtNovo / 100)) * 1.4;
          const denomSecaoNovo = (bw / 100) * Math.pow(dNovo / 100, 2) * (fcd * 1000);
          const kmdNovo = (msdCorNovo * 10) / denomSecaoNovo;
          const raizKxNovo = 1 - (2 * kmdNovo) / (alfac * etac);
          const kxNovo = raizKxNovo >= 0 ? (1 - Math.sqrt(raizKxNovo)) / lambda : NaN;
          const kzNovo = 1 - (lambda / 2) * kxNovo;
          const asTracaoNovo = (msdCorNovo * 10) / (kzNovo * (dNovo / 100) * fydCm2);
          const asGovernanteNovo = Math.max((Number.isFinite(asTracaoNovo) ? asTracaoNovo : 0) + aslFaceH, asMin);
          const lbNecNovo = Math.max(lbApoio * 0.7 * (asGovernanteNovo / asProvNovo), lbMinApoio);
          verifNovo = { dLinhaNovo, dNovo, asGovernanteNovo, asProvNovo, lbNecNovo, ok: lDisponivel >= lbNecNovo, camadasNovo: linhasNovo.length };
        } else verifNovo = null;
      } else {
        // momento positivo: algoritmo ordenado — 1) tenta reto com o nº mínimo (1/3 do vão ou 2 barras);
        // 2) se não ancorar, tenta gancho incrementando o nº de barras até o total do vão; 3) se ainda assim
        // não ancorar, entra o grampo.
        const nMin = Math.max(Math.ceil(nTotalApoio / 3), 2);
        const asEfMin = nMin * areaFlexaoUnit;
        const lbNecRetoMin = Math.max(lbApoio * 1.0 * (asCalcApoio / asEfMin), lbMinApoio);
        const retoMinOk = lDisponivel >= lbNecRetoMin;

        lbNecRetoAtual = lbNecRetoMin;
        ancoraRetoOk = retoMinOk;
        cabeComMinimo = lDisponivel >= lbMinApoio;

        let nEfFinal = nMin, lbNecFinal = lbNecRetoMin, metodoFinal = "reto", aprovadoFinal = retoMinOk;
        if (!retoMinOk && cabeComMinimo) {
          for (let nEf = nMin; nEf <= nTotalApoio; nEf++) {
            const asEf = nEf * areaFlexaoUnit;
            const lbNecG = Math.max(lbApoio * 0.7 * (asCalcApoio / asEf), lbMinApoio);
            if (lDisponivel >= lbNecG) { nEfFinal = nEf; lbNecFinal = lbNecG; metodoFinal = "gancho"; aprovadoFinal = true; break; }
            nEfFinal = nEf; lbNecFinal = lbNecG; metodoFinal = "gancho"; aprovadoFinal = false;
          }
        } else if (!retoMinOk) {
          metodoFinal = "gancho"; aprovadoFinal = false;
        }

        lbNecGanchoAtual = metodoFinal === "gancho" ? lbNecFinal : Math.max(lbApoio * 0.7 * (asCalcApoio / asEfMin), lbMinApoio);
        ancoraGanchoOk = metodoFinal === "gancho" ? aprovadoFinal : (lDisponivel >= lbNecGanchoAtual);
        nMinGancho = metodoFinal === "gancho" ? nEfFinal : nMin;

        // reverificação com o nº de barras final encontrado (d' muda com mais camadas)
        const linhasNovo = distribuirEmCamadas(nEfFinal);
        const dLinhaNovo = centroideDLinha(linhasNovo);
        const dNovo = h - dLinhaNovo;
        const asProvNovo = nEfFinal * areaFlexaoUnit;
        let asGovernanteNovo;
        if (momentoApoioPilarV !== 0) {
          const msdApoioKNmNovo = Math.abs(momentoApoioPilarV) * 1.4 * 10; // kN·m
          const rsdApoioNovo = (al / dNovo) * (vsd * 10) + msdApoioKNmNovo / (dNovo / 100); // kN — d em metros aqui
          asGovernanteNovo = Math.max(rsdApoioNovo / fydCm2, asProvTracao / 3, 2 * areaFlexaoUnit);
        } else {
          asGovernanteNovo = Math.max((al / dNovo) * ((vsd * 10) / fydCm2), asProvTracao / 3, 2 * areaFlexaoUnit);
        }
        const alphaNovo = metodoFinal === "reto" ? 1.0 : 0.7;
        const lbNecNovo = Math.max(lbApoio * alphaNovo * (asGovernanteNovo / asProvNovo), lbMinApoio);
        verifNovo = { dLinhaNovo, dNovo, asGovernanteNovo, asProvNovo, lbNecNovo, ok: lDisponivel >= lbNecNovo, camadasNovo: linhasNovo.length, metodoFinal, nEfFinal, aprovadoFinal };

        // grampo: só entra se nem reto (com o mínimo) nem gancho (até o total de barras do vão) resolverem
        if (!aprovadoFinal) {
          const opGrampo = OPCOES_GRAMPO.find((o) => o.value === phiGrampo) || OPCOES_GRAMPO[2];
          const diamGrampoCm = opGrampo.diamCm;
          const forcaNecessaria = asCalcApoio * fydCm2; // kN
          const semCapacidadeConfiavel = lDisponivel < lbMinApoio;
          const fracaoDisponivel = semCapacidadeConfiavel ? 0 : (lbNecFinal > 0 ? Math.min(1, lDisponivel / lbNecFinal) : 1);
          const forcaDisponivel = forcaNecessaria * fracaoDisponivel;
          const forcaFaltante = Math.max(0, forcaNecessaria - forcaDisponivel);
          const asGrampoNecessario = forcaFaltante / fydCm2;
          const areaGrampoUnit = (Math.PI * diamGrampoCm * diamGrampoCm) / 4;
          const nGrampos = asGrampoNecessario > 0 ? Math.ceil(asGrampoNecessario / (2 * areaGrampoUnit)) : 0;
          grampoCalc = { opGrampo, forcaNecessaria, forcaDisponivel, forcaFaltante, asGrampoNecessario, areaGrampoUnit, nGrampos, semCapacidadeConfiavel };
        } else grampoCalc = null;
      }

      apoioCalc = {
        lDisponivel, aderenciaMa, lbApoio, lbMinApoio, asCalcApoio, apoioMomentoNulo,
        lbNecRetoAtual, ancoraRetoOk,
        lbNecGanchoAtual, ancoraGanchoOk,
        cabeComMinimo, nMinGancho, verifNovo, grampoCalc,
      };
    }

    // --- Ancoragem no apoio-viga (NBR 6118 18.3.2.4.2 — apoio de extremidade com momento nulo) ---
    // Força de tração a ancorar: Rsd = Vsd·al/(0,9d) (decalagem do diagrama a partir do ponto de momento nulo),
    // nunca inferior a 1/3 do As adotado na flexão do vão (mínimo construtivo usual).
    const larguraApoioVigaV = num(larguraApoioViga);
    let apoioVigaCalc = null;
    if (larguraApoioVigaV > 0) {
      const folgaApoio = 1; // cm — folga padronizada além do cobrimento (montagem)
      const lDisponivelV = Math.max(0, larguraApoioVigaV - c - folgaApoio);

      // Passo A e B: As necessário no apoio = (al/d) × (Vsd/fyd) — usa o al já calculado no item 2
      // (o piso de Rsd ≥ 0,5·Vsd já vem embutido, pois al tem seu próprio piso de 0,5d)
      const alSobreD = al / d;
      const vsdKN = vsd * 10;
      const asApoioForca = alSobreD * (vsdKN / fydCm2); // cm²
      const asApoioMin = Math.max(asProvTracao / 3, 2 * areaFlexaoUnit); // 1/3 do vão, nunca menos que 2 barras
      const asApoioNec = Math.max(asApoioForca, asApoioMin);

      // Passo D: diâmetro do pino de dobra depende da bitola (CA-50: 5Ø se Ø<20mm, 8Ø se Ø≥20mm)
      const raioDobraV = diamFlexaoMm < 20 ? 2.5 * diamFlexaoCm : 4 * diamFlexaoCm;
      const larguraMinGanchoV = raioDobraV + diamFlexaoCm + estriboCm + c; // L_min_apoio = r + φ + φ_estribo + c_nom
      const folgaBaseV = larguraApoioVigaV - larguraMinGanchoV; // Folga_base = b_a - L_min_apoio
      const ganchoCabeGeometricamenteV = folgaBaseV >= 0;
      const alphaV = ganchoCabeGeometricamenteV ? 0.7 : 1.0; // usa gancho se couber; senão, só reto é fisicamente possível

      // Passo E: loop iterativo — começa no nº mínimo de barras (1/3 do vão ou 2 barras) e vai incrementando até ancorar ou esgotar.
      // A razão do lb,nec usa a força real necessária (asApoioForca), não o valor já inflado pelo piso construtivo —
      // o piso só define quantas barras no mínimo são fornecidas (o que já reduz a tensão por barra e, com isso, o lb,nec).
      const lbMinApoioV = Math.max(8 * diamFlexaoCm, 6); // lb,mín específico do apoio: 8×Ø ou 6cm, o que for maior
      const nTotal = nCertoTracao;
      let nEf = Math.max(1, Math.ceil(nTotal / 3), 2);
      let lbNecV = Infinity, lbNecBrutoV = Infinity, asEfV = 0, aprovadoV = false;
      for (; nEf <= nTotal; nEf++) {
        asEfV = nEf * areaFlexaoUnit;
        lbNecBrutoV = alphaV * lbBoa * (asApoioForca / asEfV);
        lbNecV = Math.max(lbNecBrutoV, lbMinApoioV);
        if (lDisponivelV >= lbNecV) { aprovadoV = true; break; }
      }
      if (nEf > nTotal) { nEf = nTotal; asEfV = nEf * areaFlexaoUnit; lbNecBrutoV = alphaV * lbBoa * (asApoioForca / asEfV); lbNecV = Math.max(lbNecBrutoV, lbMinApoioV); }
      const pisoGovernaV = lbNecBrutoV < lbMinApoioV;

      // Passo F: grampo complementar — só quando nem com 100% das barras do vão a ancoragem direta resolve
      let grampoCalcV = null;
      const forcaApoioKN = asApoioForca * fydCm2; // kN — força real a ancorar (sem a inflação do piso construtivo)
      if (!aprovadoV) {
        const opGrampoV = OPCOES_GRAMPO.find((o) => o.value === phiGrampo) || OPCOES_GRAMPO[2];
        const diamGrampoCmV = opGrampoV.diamCm;
        // abaixo do lb,mín absoluto, a barra não desenvolve nenhuma aderência confiável — o grampo tem que
        // ancorar a força inteira sozinho. Só quando o disponível já supera o lb,mín (mas ainda é menor que
        // o lb,nec calculado) é que se considera aproveitamento parcial das barras.
        const semCapacidadeConfiavelV = lDisponivelV < lbMinApoioV;
        const fracaoDisponivelV = semCapacidadeConfiavelV ? 0 : (lbNecV > 0 ? Math.min(1, lDisponivelV / lbNecV) : 1);
        const deltaFSdV = forcaApoioKN * (1 - fracaoDisponivelV); // kN — força residual não ancorada
        const asGrampoNecessarioV = deltaFSdV / fydCm2;
        const areaGrampoUnitV = (Math.PI * diamGrampoCmV * diamGrampoCmV) / 4;
        const nGramposV = asGrampoNecessarioV > 0 ? Math.ceil(asGrampoNecessarioV / (2 * areaGrampoUnitV)) : 0;
        const loTranspasseV = lbBoa; // comprimento de transpasse do grampo para dentro do vão (≥ lb)
        grampoCalcV = { opGrampo: opGrampoV, forcaNecessaria: forcaApoioKN, deltaFSd: deltaFSdV, asGrampoNecessario: asGrampoNecessarioV, nGrampos: nGramposV, loTranspasse: loTranspasseV, semCapacidadeConfiavelV };
      }

      apoioVigaCalc = {
        lDisponivel: lDisponivelV, forcaApoioKN, asApoioForca, asApoioMin, asApoioNec,
        raioDobraV, larguraMinGanchoV, folgaBaseV, ganchoCabeGeometricamenteV, alphaV,
        nTotal, nEf, asEfV, lbNecV, lbNecBrutoV, pisoGovernaV, lbMinApoioV, aprovadoV, grampoCalcV,
      };
    }

    const asw = (vsd * 10 - vc * 10) / (0.9 * (d / 100) * fydCm2);
    const aswMin = 0.2 * bw * 100 * (fctm / fykv);
    const aswTorcaoTotal = 2 * As90;
    const aswGovernante = Math.max(asw + aswTorcaoTotal, aswMin); // mantido p/ exibição/interação

    const interacao = (Number.isFinite(vRd2) && Trd2 > 0) ? vsd / vRd2 + (tk !== 0 ? Tsd / Trd2 : 0) : NaN;
    const interacaoOk = Number.isFinite(interacao) ? interacao <= 1 : null;

    const limite067 = 0.67 * vRd2;
    const limite02 = 0.2 * vRd2;
    const smaxLong = Math.min(vsd > limite067 ? 0.3 * d : 0.6 * d, vsd > limite067 ? 20 : 30);
    const smaxTrans = Math.min(vsd > limite02 ? 0.6 * d : d, vsd > limite02 ? 35 : 80);
    // trava de espaçamento por torção (NBR 6118): s ≤ ue/8, com ue = perímetro da linha média da parede fina
    const smaxTorcao = tk !== 0 ? (ue * 100) / 8 : Infinity; // ue em m -> cm

    // estribo escolhido — o espaçamento pelo cisalhamento pode usar TODOS os ramos (mais ramos = mais área
    // resistente ao corte), mas a torção só é resistida pelos 2 ramos periféricos (estribo fechado) — os
    // ramos internos de vigas largas (Bw>30cm) não fecham o perímetro de torção, então não contam pra ela.
    const areaLegEstribo = (Math.PI * estriboCm * estriboCm) / 4;
    const aswCisalhamentoGovernante = Math.max(asw, aswMin);
    const sCalcCisalhamentoM = (ramos * areaLegEstribo) / aswCisalhamentoGovernante;
    const sCalcTorcaoM = tk !== 0 && aswTorcaoTotal > 0 ? (2 * areaLegEstribo) / aswTorcaoTotal : Infinity;
    const sCalcM = Math.min(sCalcCisalhamentoM, sCalcTorcaoM);
    const sCm = Math.min(Math.floor(sCalcM * 100), Math.floor(smaxLong), Math.floor(smaxTorcao));
    const asAdotadoEstribo = sCm > 0 ? (ramos * areaLegEstribo) / (sCm / 100) : NaN;
    const asAdotadoTorcao = sCm > 0 ? (2 * areaLegEstribo) / (sCm / 100) : NaN; // só os 2 ramos periféricos
    const torcaoEstriboOk = tk !== 0 ? (Number.isFinite(asAdotadoTorcao) ? asAdotadoTorcao >= aswTorcaoTotal : null) : null;
    const vsw = Number.isFinite(asAdotadoEstribo) ? ((d / 100) * asAdotadoEstribo * fydCm2 * 0.9) / 10 : NaN;
    const vRd3 = vc + vsw;
    const estriboOk = Number.isFinite(vRd3) ? (vsd < vRd3 && bielaOk !== false) : null;
    const estriboDentroLimite = sCm > 0 && sCm <= smaxLong;

    // largura do estribo — todos os estribos usados na seção têm essa mesma largura (ver larguraEstriboCalc)
    const numEstribosCalc = Math.max(1, Math.round(ramos / 2));
    const larguraEstribo = larguraEstriboCalc(bw, c, numEstribosCalc);
    const distanciaEntrePernas = larguraEstribo;
    const pernasDentroLimite = distanciaEntrePernas <= smaxTrans;

    // largura mínima que o estribo pode ter, exigida por corte e dobra (tabela por bitola)
    const larguraMinimaPerna = LARGURA_MINIMA_PERNA[Number(phiEstribo)] || 0;
    const pernaAtendeMinimo = distanciaEntrePernas >= larguraMinimaPerna;

    // --- Verificação de furo na alma ---
    const alturaFuroV = num(alturaFuro), cotaFuroTopoV = num(cotaFuroTopo), larguraFuroV = num(larguraFuro);
    let furoCalc = null;
    if (alturaFuroV > 0) {
      // posição da LN e do limite junto à última camada de tração, medidas a partir da face SUPERIOR da viga
      const lnDoTopo = momentoNegativo ? h - xCm : xCm;
      const limiteUltimaCamada = coberturaTracao + estriboCm + diamFlexaoCm / 2 + (camadasTracao - 1) * (espVert + diamFlexaoCm) + diamFlexaoCm / 2 + c; // até a borda da última camada + cobrimento extra
      const limiteDoTopo = momentoNegativo ? limiteUltimaCamada : h - limiteUltimaCamada;
      const zonaTopo = Math.min(lnDoTopo, limiteDoTopo);
      const zonaBase = Math.max(lnDoTopo, limiteDoTopo);

      const furoTopo = cotaFuroTopoV, furoBase = cotaFuroTopoV + alturaFuroV;
      const posicaoOk = furoTopo >= zonaTopo && furoBase <= zonaBase;

      // largura do furo (m, ao longo do vão) — regra geométrica: m ≤ 1,5h
      const larguraMaxFuro = 1.5 * h;
      const larguraFuroOk = larguraFuroV > 0 ? larguraFuroV <= larguraMaxFuro : null;

      // altura do furo (h0) — regra geométrica: h0 ≤ h/3 (Sussekind)
      const alturaMaxFuro = h / 3;
      const alturaFuroOk = alturaFuroV <= alturaMaxFuro;

      const alturaAcima = Math.max(0, furoTopo);
      const alturaAbaixo = Math.max(0, h - furoBase);
      const regiaoAcima = momentoNegativo ? "tracionada" : "comprimida";
      const regiaoAbaixo = momentoNegativo ? "comprimida" : "tracionada";

      // divisão do cortante entre os banzos: 80% no banzo comprimido / 20% no tracionado — considera que
      // o banzo tracionado fissura e perde rigidez no Estádio II (prática de projeto)
      const propAcima = regiaoAcima === "comprimida" ? 0.8 : 0.2;
      const propAbaixo = 1 - propAcima;
      const vsdAcima = vsd * propAcima, vsdAbaixo = vsd * propAbaixo;

      const dAcima = Math.max(0, alturaAcima - c);
      const dAbaixo = Math.max(0, alturaAbaixo - c);
      const vRd2Acima = (0.27 * (1 - fckv / 250) * (fcd * 1000) * (bw / 100) * (dAcima / 100)) / 10;
      const vRd2Abaixo = (0.27 * (1 - fckv / 250) * (fcd * 1000) * (bw / 100) * (dAbaixo / 100)) / 10;
      const vcAcima = (0.6 * ((fctkInf / 1.4) * 1000) * (bw / 100) * (dAcima / 100)) / 10;
      const vcAbaixo = (0.6 * ((fctkInf / 1.4) * 1000) * (bw / 100) * (dAbaixo / 100)) / 10;
      const aswAcima = dAcima > 0 ? Math.max(0, (vsdAcima * 10 - vcAcima * 10) / (0.9 * (dAcima / 100) * fydCm2)) : 0;
      const aswAbaixo = dAbaixo > 0 ? Math.max(0, (vsdAbaixo * 10 - vcAbaixo * 10) / (0.9 * (dAbaixo / 100) * fydCm2)) : 0;
      const aswGovAcima = Math.max(aswAcima, aswMin);
      const aswGovAbaixo = Math.max(aswAbaixo, aswMin);

      const bielaAcimaOk = Number.isFinite(vRd2Acima) ? vsdAcima < vRd2Acima : null;
      const bielaAbaixoOk = Number.isFinite(vRd2Abaixo) ? vsdAbaixo < vRd2Abaixo : null;
      const aswAdotadaOk_Acima = Number.isFinite(asAdotadoEstribo) ? aswAcima <= asAdotadoEstribo : null;
      const aswAdotadaOk_Abaixo = Number.isFinite(asAdotadoEstribo) ? aswAbaixo <= asAdotadoEstribo : null;

      // espaçamento do estribo (mesma bitola/ramos da Seção 9) que atende cada trecho isoladamente
      const sCalcAcimaM = aswGovAcima > 0 ? (ramos * areaLegEstribo) / aswGovAcima : Infinity;
      const sCalcAbaixoM = aswGovAbaixo > 0 ? (ramos * areaLegEstribo) / aswGovAbaixo : Infinity;
      const sNecAcima = Math.max(5, Math.min(Math.floor(sCalcAcimaM * 100), Math.floor(smaxLong)));
      const sNecAbaixo = Math.max(5, Math.min(Math.floor(sCalcAbaixoM * 100), Math.floor(smaxLong)));
      const sNecFuro = Math.min(sNecAcima, sNecAbaixo); // espaçamento único que atende as duas partes, no trecho do furo

      // --- Momento local Vierendeel: Md1 ≥ Vd1·(m/2), Md2 ≥ Vd2·(m/2) — só calculável com a largura m informada ---
      let vierendeel = null;
      if (larguraFuroV > 0) {
        const md1 = ((vsdAcima * 10) * (larguraFuroV / 2)) / 100; // kN·m
        const md2 = ((vsdAbaixo * 10) * (larguraFuroV / 2)) / 100; // kN·m

        // braço de alavanca local de cada banzo (para o momento de Vierendeel), z ≈ 0,8·h_banzo
        const zLocalAcima = 0.8 * alturaAcima;
        const zLocalAbaixo = 0.8 * alturaAbaixo;

        // --- Força de banzo Rc=Rt: Z = H − (h1+h2)/2 (distância entre os centros dos 2 banzos),
        // Rc=Rt = Msd,global/Z ---
        const zBanzo = h - (alturaAcima + alturaAbaixo) / 2; // cm
        const mdGlobalKNm = mkAbs * 1.4 * 10; // kN·m
        const rcRtKN = zBanzo > 0 ? mdGlobalKNm / (zBanzo / 100) : NaN; // kN

        // --- armadura do porta-estribo (existente no banzo comprimido) ---
        const opPortaEstribo = OPCOES_TORCAO.find((o) => o.value === phiPortaEstribo) || OPCOES_TORCAO[1];
        const areaPortaEstriboUnit = (Math.PI * opPortaEstribo.diamCm * opPortaEstribo.diamCm) / 4;
        const areaPortaEstriboTotal = qtdPortaEstribo * areaPortaEstriboUnit;

        // flexo-compressão (banzo comprimido): Rc ALIVIA a demanda de tração local (M1 tende a tracionar a
        // face interna do banzo, mas a compressão global de Rc contrapõe isso); flexo-tração (banzo
        // tracionado): Rt SOMA à demanda de M2. Em cada caso, compara com a armadura já existente
        // (porta-estribo no banzo comprimido, ou a própria armadura de flexão principal no tracionado) e o
        // que faltar vira o reforço isolado do furo.
        const calcBanzo = (mdLocal, zLocal, regiao, asExistente) => {
          if (!(zLocal > 0) || !Number.isFinite(rcRtKN)) return { asNecessario: NaN, asFaltante: NaN };
          const asLocal = mdLocal / ((zLocal / 100) * fydCm2);
          const asBanzo = rcRtKN / fydCm2;
          const asNecessario = regiao === "comprimida" ? Math.max(0, asLocal - asBanzo) : asLocal + asBanzo;
          const asFaltante = Math.max(0, asNecessario - asExistente);
          return { asNecessario, asFaltante };
        };
        const asExistenteAcima = regiaoAcima === "comprimida" ? areaPortaEstriboTotal : asProvTracao;
        const asExistenteAbaixo = regiaoAbaixo === "comprimida" ? areaPortaEstriboTotal : asProvTracao;
        const calc1 = calcBanzo(md1, zLocalAcima, regiaoAcima, asExistenteAcima);
        const calc2 = calcBanzo(md2, zLocalAbaixo, regiaoAbaixo, asExistenteAbaixo);
        const flex1 = { as: calc1.asNecessario, z: zLocalAcima };
        const flex2 = { as: calc2.asNecessario, z: zLocalAbaixo };

        // reforço isolado do furo = só o que falta além da armadura já existente (porta-estribo/flexão principal)
        const asFinal1 = Number.isFinite(calc1.asFaltante) ? calc1.asFaltante : 0;
        const asFinal2 = Number.isFinite(calc2.asFaltante) ? calc2.asFaltante : 0;

        // --- Armadura de suspensão (montantes) nas 2 extremidades da abertura: Asw,susp = Vsd/fyd, em CADA lateral ---
        const vdSuspensaoKN = vsd * 10;
        const asSusExtremidade = vdSuspensaoKN / fydCm2; // cm² — por extremidade
        const compDistribExtremidade = h / 4; // cm
        const areaEstriboUnicoFuro = ramos * areaLegEstribo;
        const nEstribosExtremidade = areaEstriboUnicoFuro > 0 ? Math.ceil(asSusExtremidade / areaEstriboUnicoFuro) : 0;
        const espacamentoExtremidade = nEstribosExtremidade > 1 ? Math.max(1, Math.floor(compDistribExtremidade / (nEstribosExtremidade - 1))) : compDistribExtremidade;

        // --- reforço superior e inferior do furo: dimensionamento INDEPENDENTE — cada banzo com seu próprio
        // As real e sua própria bitola (não força a mesma armadura pros dois lados) ---
        const opFuroSup = OPCOES_TORCAO.find((o) => o.value === phiFuro) || OPCOES_TORCAO[1];
        const opFuroInf = OPCOES_TORCAO.find((o) => o.value === phiFuroInferior) || OPCOES_TORCAO[1];
        const areaFuroUnitSup = (Math.PI * opFuroSup.diamCm * opFuroSup.diamCm) / 4;
        const areaFuroUnitInf = (Math.PI * opFuroInf.diamCm * opFuroInf.diamCm) / 4;
        const nBarrasSuperior = asFinal1 > 0 && areaFuroUnitSup > 0 ? Math.max(2, Math.ceil(asFinal1 / areaFuroUnitSup)) : 0;
        const nBarrasInferior = asFinal2 > 0 && areaFuroUnitInf > 0 ? Math.max(2, Math.ceil(asFinal2 / areaFuroUnitInf)) : 0;
        const opFuro = opFuroSup; // mantido por compatibilidade com o restante da tela
        const areaFuroUnit = areaFuroUnitSup;

        vierendeel = {
          md1, md2, flex1, flex2, mdGlobalKNm, zBanzo, rcRtKN,
          opPortaEstribo, areaPortaEstriboUnit, areaPortaEstriboTotal, asExistenteAcima, asExistenteAbaixo,
          asFinal1, asFinal2,
          opFuro, areaFuroUnit, opFuroSup, opFuroInf, nBarrasSuperior, nBarrasInferior,
          vdSuspensaoKN, asSusExtremidade, compDistribExtremidade, nEstribosExtremidade, espacamentoExtremidade,
        };
      }

      furoCalc = {
        zonaTopo, zonaBase, furoTopo, furoBase, posicaoOk,
        larguraFuroV, larguraMaxFuro, larguraFuroOk, alturaMaxFuro, alturaFuroOk,
        alturaAcima, alturaAbaixo, propAcima, propAbaixo, regiaoAcima, regiaoAbaixo, vsdAcima, vsdAbaixo,
        dAcima, dAbaixo, vRd2Acima, vRd2Abaixo, bielaAcimaOk, bielaAbaixoOk,
        aswAcima, aswAbaixo, aswAdotadaOk_Acima, aswAdotadaOk_Abaixo,
        sNecAcima, sNecAbaixo, sNecFuro, vierendeel,
      };
    }

    // --- Armadura de suspensão (carga concentrada aplicada na alma, ex. viga secundária apoiada na viga principal) ---
    const pkSusp = num(cargaSuspensa), h1Susp = num(alturaSuspensa);
    let suspensaoCalc = null;
    if (pkSusp > 0 && h1Susp > 0) {
      const psd = pkSusp * 1.4; // tf
      const fracaoSuspender = Math.min(1, h1Susp / h); // método clássico (Leonhardt): proporcional a h1/h
      const psdSuspender = psd * fracaoSuspender; // tf
      const asSuspensao = (psdSuspender * 10) / fydCm2; // cm² — acréscimo total de área de estribo
      // comprimento a reforçar: h1 (altura suspensa), distribuído simetricamente ao redor do ponto de aplicação
      const comprimentoReforco = h1Susp; // cm
      const areaEstriboUnico = ramos * areaLegEstribo; // cm² — área de 1 estribo (todas as pernas) na bitola/ramos da Seção 9

      // combina por Nº DE BARRAS (não por taxa cm²/m — essa taxa se cancelaria matematicamente com h1,
      // já que tanto o As de suspensão quanto o comprimento da zona são proporcionais a h1):
      // conta quantos estribos o cisalhamento normal já colocaria dentro da zona, soma os estribos extras
      // que a suspensão exige, e redistribui esse total dentro do mesmo comprimento — um único espaçamento.
      const nEstribosNormaisNaZona = sCm > 0 ? Math.floor(comprimentoReforco / sCm) + 1 : 1;
      const nEstribosSuspensao = areaEstriboUnico > 0 ? Math.ceil(asSuspensao / areaEstriboUnico) : 0;
      const nTotalNaZona = nEstribosNormaisNaZona + nEstribosSuspensao;
      const espacamentoCombinado = nTotalNaZona > 1 ? Math.max(1, Math.floor(comprimentoReforco / (nTotalNaZona - 1))) : comprimentoReforco;

      suspensaoCalc = {
        psd, fracaoSuspender, psdSuspender, asSuspensao, comprimentoReforco, areaEstriboUnico,
        nEstribosNormaisNaZona, nEstribosSuspensao, nTotalNaZona, espacamentoCombinado,
      };
    }

    return {
      opFlexao, diamFlexaoCm, dLinha, d, fcd, lambda, alfac, etac, espVert,
      kmd, kx, dupla, kz, asTracao, Wo, fctkSup, mdMin, asCalcMin, asMin, duplaCalc,
      he, Ae, ue, Tsd, Trd2, torcaoOk, As90, Asl,

      distanciaEntrePernas, pernasDentroLimite, larguraMinimaPerna, pernaAtendeMinimo,
      asGovernanteTracao, nCertoTracao, asProvTracao, unitsPerLayerTracao: maxPorCamada, camadasTracao, compCalc,
      larguraDisponivel, maxPorCamada, momentoNegativo, coberturaTracao, coberturaCompressao, dLinhaComp1, folgaPrimeiraCamada, feixeVerticalAlt,
      xCm, xRedCm, epsC, epsS, forcaTf, ancoragem,
      aslFaceH, aslFaceV, peleObrigatoria, peleMinPorFace, peleGovernantePorFace, peleCalc, opPele,
      furoCalc, suspensaoCalc,
      acBruta, asMax4, asTotalAtual, taxaAtual4, dentroTaxaMax4, margemPortaEstribo, apoioCalc, apoioVigaCalc,

    };
  }, [Bw, H, cob, fck, fyk, Mk, Vk, Nk, Tk, phiFlexao, phiEstribo, nRamos, phiPele, phiTorcao, alturaFuro, cotaFuroTopo, larguraFuro, phiFuro, phiFuroInferior, qtdPortaEstribo, phiPortaEstribo, cargaSuspensa, alturaSuspensa, larguraApoio, phiGrampo, larguraApoioViga, momentoApoioPilar]);
