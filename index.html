                  <p className="text-[11px] mb-3" style={{ color: "var(--amber)" }}>
                    O lb,mín está governando (o valor bruto da fórmula, {fmt(r.apoioVigaCalc.lbNecBrutoV, 2)}cm, é menor que o piso) — a força a ancorar é pequena o suficiente para que o piso normativo limite o resultado, independente de quantas barras forem levadas ao apoio.
                  </p>
                )}
                <div className="grid sm:grid-cols-3 gap-3 mb-4">
                  <Resultado big label={`Barras necessárias no apoio — ${r.opFlexao.label}`} value={`${r.apoioVigaCalc.nEf} / ${r.apoioVigaCalc.nTotal}`} unit={r.opFlexao.feixe ? "feixe(s)" : "barra(s)"} />
                  <Reading label="As efetivo nessa quantidade" value={fmt(r.apoioVigaCalc.asEfV, 3)} unit="cm²" />
                  <VerdictBadge ok={r.apoioVigaCalc.aprovadoV} computable={true} okText="Aprovado — ancora sem grampo" failText="Não ancora nem com todas as barras do vão" insufText="—" />
                </div>
                <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>
                  Algoritmo: parte de 1/3 das barras do vão e vai incrementando (reduzindo lb,nec via As,nec/As,ef) até ancorar ou esgotar as {r.apoioVigaCalc.nTotal} barras disponíveis.
                </p>
                {r.apoioVigaCalc.grampoCalcV && (
                  <div className="mt-4 pt-4" style={{ borderTop: "1px dashed var(--rule)" }}>
                    <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>
                      {r.apoioVigaCalc.grampoCalcV.semCapacidadeConfiavelV
                        ? "Comprimento disponível < lb,mín — barras sem aderência confiável, grampo ancora 100% da força sozinho"
                        : "Mesmo com todas as barras do vão, não ancora — grampo complementar necessário"}
                    </div>
                    <div className="grid sm:grid-cols-3 gap-3">
                      <Resultado big label={`Grampo ${r.apoioVigaCalc.grampoCalcV.opGrampo.label} (U, 2 pernas)`} value={r.apoioVigaCalc.grampoCalcV.nGrampos} unit="unid." />
                      <Reading label="As do grampo necessário" value={fmt(r.apoioVigaCalc.grampoCalcV.asGrampoNecessario, 3)} unit="cm²" />
                      <Reading label="ΔFsd (força residual)" value={fmt(r.apoioVigaCalc.grampoCalcV.deltaFSd, 1)} unit="kN" />
                    </div>
                    <p className="text-[11px] mt-2" style={{ color: "var(--ink-soft)" }}>
                      Comprimento de transpasse do grampo para dentro do vão: ≥ {fmt(r.apoioVigaCalc.grampoCalcV.loTranspasse, 1)}cm, abraçando a armadura longitudinal principal.
                    </p>
                  </div>
                )}
                <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                  Como o momento é nulo no apoio, a força a ancorar é reduzida: As,força = (al/d)·(Vsd/fyd) — usando o al já calculado no item 2 (que tem seu próprio piso de 0,5d, garantindo Rsd≥0,5·Vsd). O piso construtivo (As,vão/3, nunca menos que 2 barras) define o nº mínimo de barras fornecidas, mas o lb,nec usa a razão com a força real: lb,nec = α·lb·(As,força/As,ef), sempre ≥ lb,mín = máx(8·Ø, 6cm) — mais barras que o mínimo reduzem a tensão por barra e, com isso, o lb,nec. Se mesmo com todas as barras do vão o lb,nec não couber no comprimento disponível, entra o grampo. Comprimento disponível (para lb,nec) = base da viga de apoio − cobrimento − 1cm de folga de montagem. Boa aderência sempre (armadura inferior). O raio de dobra só cabe dentro do apoio se ba ≥ L,mín = r + Ø(barra) + Ø(estribo do apoio) + cobrimento, com r = 2,5·Ø (Ø&lt;20mm) ou 4·Ø (Ø≥20mm) — se a folga (ba − L,mín) for negativa, a curva vaza pela lateral e só a ancoragem reta é fisicamente possível.
                </p>
              </>
            )}
          </div>

          {/* 9. ancoragem no apoio */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
            <SectionHeader n="5" title="Ancoragem no apoio (Pilar de extremidade)" sub="opcional — verifica a ancoragem da armadura de tração na largura do apoio" />
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
              <Field label="Largura do apoio" unit="cm" value={larguraApoio} onChange={setLarguraApoio} />
              {!r.momentoNegativo && (
                <Field label="Momento no apoio (se ≠0)" unit="tf·m" value={momentoApoioPilar} onChange={setMomentoApoioPilar} />
              )}
              {r.apoioCalc && !r.momentoNegativo && (
                <Select label="Bitola do grampo" value={phiGrampo} onChange={setPhiGrampo} options={OPCOES_GRAMPO} />
              )}
            </div>
            {!r.apoioCalc && (
              <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>Informe a largura do apoio para calcular.</p>
            )}
            {r.apoioCalc && (
              <>
                {r.apoioCalc.apoioMomentoNulo && (
                  <div className="mb-3 text-[11px] font-semibold" style={{ color: "var(--blue)" }}>
                    Momento positivo no vão → apoio de extremidade com momento nulo (mesmas considerações do item 4: força reduzida via al/d).
                  </div>
                )}
                <div className="mb-3 text-[11px] font-semibold" style={{ color: r.apoioCalc.aderenciaMa ? "var(--amber)" : "var(--green)" }}>
                  Situação de aderência: {r.apoioCalc.aderenciaMa ? "MÁ (momento negativo, H ≥ 60cm)" : "BOA"}
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                  <Reading label="Comprimento disponível" value={fmt(r.apoioCalc.lDisponivel, 1)} unit="cm" />
                  <Reading label="lb básico" value={fmt(r.apoioCalc.lbApoio, 1)} unit="cm" />
                  <Reading label="lb,nec reto (barras atuais)" value={fmt(r.apoioCalc.lbNecRetoAtual, 1)} unit="cm" />
                  <Reading label="lb,nec c/ gancho (barras atuais)" value={fmt(r.apoioCalc.lbNecGanchoAtual, 1)} unit="cm" />
                </div>
                <div className="flex flex-wrap gap-3 mb-4">
                  <VerdictBadge ok={r.apoioCalc.ancoraRetoOk} computable={true} okText="Ancora reto, sem gancho" failText="Não ancora reto (com as barras atuais)" insufText="—" />
                  <VerdictBadge ok={r.apoioCalc.ancoraGanchoOk} computable={true} okText="Ancora com gancho, sem aumentar barras" failText="Não ancora com as barras atuais — precisa de mais barras" insufText="—" />
                </div>
                {!r.momentoNegativo && r.apoioCalc.verifNovo && (
                  <div className="mb-4">
                    <Resultado
                      big
                      label={`Solução final — ${r.apoioCalc.verifNovo.metodoFinal === "reto" ? "barra reta" : "com gancho"}, Ø${r.ancoragem.diamMm}mm`}
                      value={r.apoioCalc.verifNovo.nEfFinal}
                      unit={r.opFlexao.feixe ? "feixe(s)" : "barra(s)"}
                    />
                  </div>
                )}
                {!r.apoioCalc.ancoraGanchoOk && (
                  <>
                    {r.apoioCalc.cabeComMinimo ? (
                      <div className="grid sm:grid-cols-2 gap-3">
                        <Resultado big label={`Solução com gancho — ${r.opFlexao.label}`} value={r.apoioCalc.nMinGancho} unit={r.opFlexao.feixe ? "feixe(s)" : "barra(s)"} />
                        {r.apoioCalc.verifNovo && (
                          <Reading
                            label="Reverificação (novo d')"
                            value={r.apoioCalc.verifNovo.ok ? "OK" : "AINDA NÃO ATENDE"}
                            unit={`d=${fmt(r.apoioCalc.verifNovo.dNovo, 1)}cm · ${r.apoioCalc.verifNovo.camadasNovo} camada(s) · lb,nec=${fmt(r.apoioCalc.verifNovo.lbNecNovo, 1)}cm`}
                            tone={r.apoioCalc.verifNovo.ok ? "good" : "warn"}
                          />
                        )}
                      </div>
                    ) : (
                      <div className="text-[11px] font-semibold" style={{ color: "var(--red)" }}>
                        ⚠ Mesmo aumentando o nº de barras, o comprimento disponível ({fmt(r.apoioCalc.lDisponivel, 1)}cm) é menor que o mínimo absoluto de ancoragem ({fmt(r.apoioCalc.lbMinApoio, 1)}cm) — só resolve com apoio mais largo{r.apoioCalc.grampoCalc ? " ou grampo" : ""}.
                      </div>
                    )}
                    {r.apoioCalc.grampoCalc && (
                      <div className="mt-4 pt-4" style={{ borderTop: "1px dashed var(--rule)" }}>
                        <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>Alternativa: grampo (só momento positivo)</div>
                        <div className="grid sm:grid-cols-3 gap-3">
                          <Resultado big label={`Grampo ${r.apoioCalc.grampoCalc.opGrampo.label} (U, 2 pernas)`} value={r.apoioCalc.grampoCalc.nGrampos} unit="unid." />
                          <Reading label="As do grampo necessário" value={fmt(r.apoioCalc.grampoCalc.asGrampoNecessario, 3)} unit="cm²" />
                          <Reading label="Força faltante" value={fmt(r.apoioCalc.grampoCalc.forcaFaltante, 1)} unit="kN" />
                        </div>
                      </div>
                    )}
                  </>
                )}
                <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                  Comprimento disponível = largura do apoio − cobrimento. A aderência segue a NBR 9.3.1: tração no topo (momento negativo) com H≥60cm cai na região de má aderência; nos demais casos é boa aderência. No momento negativo, o As a ancorar é o da flexão do vão. No momento positivo, o apoio é de extremidade: As,apoio = Rsd/fyd, com Rsd = (al/d)·Vsd + Msd,apoio/d (o momento no apoio é opcional — se não informado, Rsd fica só com a parcela do cisalhamento, igual ao item 4). O algoritmo tenta primeiro barra reta com o nº mínimo de barras (1/3 do vão ou 2), depois gancho aumentando as barras até o total do vão, e só então o grampo — em ambos os casos, ao mudar o nº de barras o d' muda (mais camadas) e a verificação é refeita com o d atualizado.
                </p>
              </>
            )}
          </div>

          {/* 7. furo na alma */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>

                <Select label="Bitola — banzo superior" value={phiFuro} onChange={setPhiFuro} options={OPCOES_TORCAO} />
                <Select label="Bitola — banzo inferior" value={phiFuroInferior} onChange={setPhiFuroInferior} options={OPCOES_TORCAO} />

                  <FuroDiagrama H={H} Bw={Bw} furoTopo={r.furoCalc.furoTopo} furoBase={r.furoCalc.furoBase} zonaTopo={r.furoCalc.zonaTopo} zonaBase={r.furoCalc.zonaBase} posicaoOk={r.furoCalc.posicaoOk} />

              <>
                <div className="mb-4 flex flex-wrap gap-3">
                  <VerdictBadge
                    ok={r.furoCalc.posicaoOk} computable={true}
                    okText={`Furo dentro da zona permitida (${fmt(r.furoCalc.zonaTopo, 1)}cm a ${fmt(r.furoCalc.zonaBase, 1)}cm do topo)`}
                    failText={`Furo fora da zona permitida — deve ficar entre ${fmt(r.furoCalc.zonaTopo, 1)}cm e ${fmt(r.furoCalc.zonaBase, 1)}cm do topo (abaixo da LN e acima da última camada de tração)`}
                    insufText="—"
                  />
                  <VerdictBadge
                    ok={r.furoCalc.alturaFuroOk} computable={true}
                    okText={`Altura do furo dentro do limite (h0 ≤ ${fmt(r.furoCalc.alturaMaxFuro, 1)}cm = h/3)`}
                    failText={`Altura do furo excede h/3 = ${fmt(r.furoCalc.alturaMaxFuro, 1)}cm`}
                    insufText="—"
                  />
                  {r.furoCalc.larguraFuroOk !== null && (
                    <VerdictBadge
                      ok={r.furoCalc.larguraFuroOk} computable={true}
                      okText={`Largura do furo dentro do limite (m ≤ ${fmt(r.furoCalc.larguraMaxFuro, 1)}cm = 1,5h)`}
                      failText={`Largura do furo (${fmt(r.furoCalc.larguraFuroV, 1)}cm) excede 1,5h = ${fmt(r.furoCalc.larguraMaxFuro, 1)}cm`}
                      insufText="—"
                    />
                  )}
                </div>
                <p className="text-[11px] mb-3" style={{ color: "var(--ink-soft)" }}>
                  Distribuição do cortante entre os banzos: <strong>80% na região comprimida / 20% na tracionada</strong> (Estádio II).
                </p>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                  <Reading label="Altura acima do furo" value={fmt(r.furoCalc.alturaAcima, 1)} unit="cm" />
                  <Reading label="Altura abaixo do furo" value={fmt(r.furoCalc.alturaAbaixo, 1)} unit="cm" />
                  <Reading label={`Vsd acima (${r.furoCalc.regiaoAcima})`} value={fmt(r.furoCalc.vsdAcima, 3)} unit={`tf · ${fmt(r.furoCalc.propAcima * 100, 0)}%`} />
                  <Reading label={`Vsd abaixo (${r.furoCalc.regiaoAbaixo})`} value={fmt(r.furoCalc.vsdAbaixo, 3)} unit={`tf · ${fmt(r.furoCalc.propAbaixo * 100, 0)}%`} />
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                  <Reading label="VRd2 acima" value={fmt(r.furoCalc.vRd2Acima, 3)} unit="tf" />
                  <Reading label="VRd2 abaixo" value={fmt(r.furoCalc.vRd2Abaixo, 3)} unit="tf" />
                  <Reading label="Asw necessário acima" value={fmt(r.furoCalc.aswAcima, 3)} unit="cm²/m" />
                  <Reading label="Asw necessário abaixo" value={fmt(r.furoCalc.aswAbaixo, 3)} unit="cm²/m" />
                </div>
                <div className="flex flex-wrap gap-3 mb-4">
                  <VerdictBadge ok={r.furoCalc.bielaAcimaOk} computable={r.furoCalc.bielaAcimaOk !== null} okText="Biela acima OK" failText="Biela acima NÃO passa" insufText="—" />
                  <VerdictBadge ok={r.furoCalc.bielaAbaixoOk} computable={r.furoCalc.bielaAbaixoOk !== null} okText="Biela abaixo OK" failText="Biela abaixo NÃO passa" insufText="—" />
                </div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Resultado big label={`Estribo Ø${phiEstribo} · trecho do furo`} value={`c/ ${r.furoCalc.sNecFuro}`} unit="cm" />
                  <Reading label="Atende acima com" value={`c/ ${r.furoCalc.sNecAcima}`} unit="cm" tone={r.furoCalc.sNecAcima >= r.sCm ? "good" : "warn"} />
                  <Reading label="Atende abaixo com" value={`c/ ${r.furoCalc.sNecAbaixo}`} unit="cm" tone={r.furoCalc.sNecAbaixo >= r.sCm ? "good" : "warn"} />
                </div>
                <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                  Espaçamento (mesma bitola/ramos da Seção 9) que atende cada trecho isoladamente — adote o menor (c/ {r.furoCalc.sNecFuro}cm) na região do furo caso o estribo da Seção 9 (c/ {r.sCm}cm) não cubra alguma das partes.
                </p>
                <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                  Vsd é dividido entre as seções acima e abaixo do furo de forma fixa — 0,8·Vsd na região comprimida e 0,2·Vsd na região tracionada (não mais proporcional à rigidez h³). d de cada seção aproximado por (altura da seção − cobrimento). Largura do furo (m) limitada a 1,5h. O estribo adotado (Ø{phiEstribo}, {r.sCm}cm) é o mesmo especificado na Seção 9 — se não cobrir alguma das duas partes, reforçar localmente ao redor do furo.
                </p>

                {r.furoCalc.vierendeel && (
                  <div className="mt-4 pt-4" style={{ borderTop: "1px dashed var(--rule)" }}>
                    <div className="text-[11px] uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Momento local (Vierendeel) e força de banzo (Rc = Rt)</div>

                      <Reading label="Md2 (abaixo)" value={fmt(r.furoCalc.vierendeel.md2, 3)} unit="kN·m" />
                      <Reading label="Z (h1+h2 → H−(h1+h2)/2)" value={fmt(r.furoCalc.vierendeel.zBanzo, 1)} unit="cm" />
                      <Reading label="Rc = Rt (Md,global/Z)" value={fmt(r.furoCalc.vierendeel.rcRtKN, 2)} unit="kN" />
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                      <Reading label="z1 local (0,8·h1)" value={fmt(r.furoCalc.vierendeel.flex1.z, 1)} unit="cm" />
                      <Reading label="z2 local (0,8·h2)" value={fmt(r.furoCalc.vierendeel.flex2.z, 1)} unit="cm" />
                      <Reading label="Armadura porta-estribo" value={fmt(r.furoCalc.vierendeel.areaPortaEstriboTotal, 3)} unit="cm²" />
                      <Reading label="As flexão principal" value={fmt(r.asProvTracao, 3)} unit="cm²" />
                    </div>

                    <div className="text-[11px] uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Flexo-compressão (banzo comprimido) / flexo-tração (banzo tracionado)</div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                      <Reading label={`As necessário (${r.furoCalc.regiaoAcima})`} value={fmt(r.furoCalc.vierendeel.flex1.as, 3)} unit="cm²" />
                      <Reading label="As já existente" value={fmt(r.furoCalc.vierendeel.asExistenteAcima, 3)} unit="cm²" />
                      <Reading label={`As necessário (${r.furoCalc.regiaoAbaixo})`} value={fmt(r.furoCalc.vierendeel.flex2.as, 3)} unit="cm²" />
                      <Reading label="As já existente" value={fmt(r.furoCalc.vierendeel.asExistenteAbaixo, 3)} unit="cm²" />
                    </div>
                    <p className="text-[11px] mb-4" style={{ color: "var(--ink-soft)" }}>
                      No banzo comprimido, Rc alivia a demanda local (M1local/z1 − Rc/fyd); no banzo tracionado, Rt soma (M2local/z2 + Rt/fyd). Em cada banzo, compara-se com a armadura já existente ali (porta-estribo no comprimido, a própria armadura de flexão principal no tracionado) — o que faltar vira o reforço isolado do furo abaixo.
                    </p>

                    <div className="mt-2 mb-2 text-[11px] font-semibold" style={{ color: "var(--ink)" }}>Reforço superior e inferior do furo — dimensionamento independente, sem alterar a flexão principal</div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                      <Resultado big label={`As superior · Ø${r.furoCalc.vierendeel.opFuroSup.label.replace("Ø ", "")}`} value={fmt(r.furoCalc.vierendeel.asFinal1, 3)} unit="cm²" />
                      <Reading label="Barras acima do furo" value={r.furoCalc.vierendeel.nBarrasSuperior} unit="barra(s)" tone="accent" />
                      <Resultado big label={`As inferior · Ø${r.furoCalc.vierendeel.opFuroInf.label.replace("Ø ", "")}`} value={fmt(r.furoCalc.vierendeel.asFinal2, 3)} unit="cm²" />
                      <Reading label="Barras abaixo do furo" value={r.furoCalc.vierendeel.nBarrasInferior} unit="barra(s)" tone="accent" />
                    </div>
                    <p className="text-[11px] mb-4" style={{ color: "var(--ink-soft)" }}>
                      Md1 e Md2 vêm do efeito de pórtico (Vierendeel) induzido pela abertura: Md ≥ Vd·(m/2), com Vd dividido 80%/20% entre os banzos comprimido/tracionado. Z = H − (h1+h2)/2 (distância entre os centros dos 2 banzos), e Rc=Rt=Msd,global/Z. No banzo comprimido, o reforço combina M1local com Rc (que alivia a demanda) contra a armadura porta-estribo já existente; no banzo tracionado, combina M2local com Rt (que soma) contra a própria armadura de flexão principal já existente ali. O que faltar em cada banzo vira o reforço isolado do furo — nas bitolas próprias de cada um.
                    </p>

                    <div className="text-[11px] uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Armadura de suspensão (montantes) nas extremidades da abertura</div>
                    <div className="grid sm:grid-cols-3 gap-3">
                      <Resultado big label={`Estribo Ø${phiEstribo} · cada extremidade`} value={`c/ ${r.furoCalc.vierendeel.espacamentoExtremidade}`} unit="cm" />
                      <Reading label="Nº de estribos por extremidade" value={r.furoCalc.vierendeel.nEstribosExtremidade} unit="unid." />
                      <Reading label="Distribuídos em H/4" value={fmt(r.furoCalc.vierendeel.compDistribExtremidade, 1)} unit="cm" />
                    </div>
                    <p className="text-[11px] mt-2" style={{ color: "var(--ink-soft)" }}>
                      Asw,susp = Vsd/fyd = {fmt(r.furoCalc.vierendeel.asSusExtremidade, 3)}cm², em cada uma das duas extremidades da abertura, distribuída ao longo de H/4 a partir de cada lado — soma-se ao estribo já calculado, não o substitui.
                    </p>
                  </div>
                )}
                {r.furoCalc && (
                  <div className="mt-5 pt-5 flex justify-center" style={{ borderTop: "1px dashed var(--rule)" }}>
                    <button
                      onClick={() => gerarMemorialFuro(r, { Bw, H, cob, fck, Mk, Vk, alturaFuro, cotaFuroTopo, larguraFuro, phiEstribo })}
                      className="px-4 py-2 rounded-md text-sm font-semibold transition-colors"
                      style={{ background: "var(--blue)", color: "var(--paper)", fontFamily: "'Space Grotesk', sans-serif" }}
                    >
                      📄 Gerar memorial de cálculo do furo (PDF)
                    </button>
                  </div>
                )}
              </>
            )}
          </div>

          {/* 2. flexão */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
            <SectionHeader n="7" title={`Cálculo da flexão ${Number(Nk) !== 0 ? "composta" : "simples"}`} />
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              <Reading label="Kmd" value={fmt(r.kmd)} />
              <Reading label="Kx" value={fmt(r.kx)} />
              <Reading label="Kz" value={fmt(r.kz)} />
              <Reading label="As necessário" value={fmt(r.asTracao, 3)} unit="cm²" tone="accent" />
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              <Reading label="As,mín" value={fmt(r.asMin, 3)} unit="cm²" />
              <Reading label="As,calc (Md,min)" value={fmt(r.asCalcMin, 3)} unit="cm²" />
              <Reading label="Asl torção (soma)" value={fmt(r.Asl, 3)} unit="cm²" />
              <Reading label="As governante (tração)" value={fmt(r.asGovernanteTracao, 3)} unit="cm²" tone="good" />
            </div>
            <VerdictBadge
              ok={!r.dupla} computable={r.dupla ? !!(r.duplaCalc && Number.isFinite(r.duplaCalc.asCompressao) && r.duplaCalc.zLinha > 0) : Number.isFinite(r.kx)}
              okText="ARMADURA SIMPLES" failText="ARMADURA DUPLA"
              insufText={r.dupla ? "SEÇÃO INSUFICIENTE — mesmo com dupla, altura insuficiente para o braço de alavanca" : "SEÇÃO INSUFICIENTE — Kx não real"}
            />
          </div>

          {/* 4. armadura dupla */}
          {r.dupla && r.duplaCalc && (
            <div className="rounded-lg p-5" style={{ background: "var(--amber-soft)", border: "1px solid var(--amber)" }}>
              <SectionHeader n="8" title="Armadura dupla — cálculo complementar" />
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <Reading label="Kz,lim" value={fmt(r.duplaCalc.kzLim)} />
                <Reading label="M,lim" value={fmt(r.duplaCalc.mLim, 3)} unit="kN·m" />
                <Reading label="Z' braço" value={fmt(r.duplaCalc.zLinha, 2)} unit="cm" />
                <Reading label="As' compressão" value={fmt(r.duplaCalc.asCompressao, 3)} unit="cm²" tone="warn" />
              </div>
            </div>
          )}

          {/* 4. cisalhamento + estribo escolhido */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
            <SectionHeader n="9" title="Cisalhamento e estribo especificado" />
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
              <Reading label="Vsd" value={fmt(r.vsd, 3)} unit="tf" />
              <Reading label="VRd2 (biela)" value={fmt(r.vRd2, 3)} unit="tf" />
              <Reading label="Vc" value={fmt(r.vc, 3)} unit="tf" />
              <Reading label="Asw governante" value={fmt(r.aswGovernante, 3)} unit="cm²/m" tone="accent" />
            </div>
            <div className="mb-4">
              <VerdictBadge ok={r.bielaOk} computable={r.bielaOk !== null} okText="Vd ≤ VRd2 — BIELA PASSOU" failText="Vd > VRd2 — AUMENTAR SEÇÃO" insufText="Não calculável" />
            </div>
            <div className="grid sm:grid-cols-3 gap-3">
              <Resultado big label={`Estribo Ø${phiEstribo} · ${nRamos} ramo(s)`} value={r.sCm > 0 ? `c/ ${r.sCm}` : "—"} unit="cm" />
              <Reading label="Vsw" value={fmt(r.vsw, 3)} unit="tf" />
              <Reading label="VRd3" value={fmt(r.vRd3, 3)} unit="tf" />
            </div>
            <div className="flex flex-wrap gap-3 mt-3">
              <VerdictBadge ok={r.estriboOk} computable={r.estriboOk !== null} okText="Vd ≤ VRd3 — OK" failText="Vd > VRd3 — reduza s ou aumente Ø/ramos" insufText="—" />
            </div>
            <div className="mt-5 pt-5 flex justify-center" style={{ borderTop: "1px dashed var(--rule)" }}>
              <EstriboDetalhe
                Bw={Bw} H={H} cob={cob} coberturaTracaoCm={r.coberturaTracao} coberturaCompressaoCm={r.coberturaCompressao}
                phiEstriboCm={Number(phiEstribo) / 10} phiEstriboMm={phiEstribo} nRamos={nRamos} sCm={r.sCm}
              />
            </div>
          </div>

          {/* 6. armadura de flexão especificada */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
            <SectionHeader n="10" title="Armadura de flexão especificada" />
            <div className="grid sm:grid-cols-3 gap-3 mb-3">
              <Resultado big label={`${r.opFlexao.label} · tração`} value={r.nCertoTracao} unit={r.opFlexao.feixe ? "feixe(s)" : "barra(s)"} />
              <Reading label="As adotado" value={fmt(r.asProvTracao, 3)} unit="cm²" />
              <Reading label="Camadas necessárias" value={r.camadasTracao} unit={r.camadasTracao === 1 ? "camada" : "camadas"} tone={r.camadasTracao === 1 ? "good" : "warn"} />
            </div>
            {r.compCalc && (
              <div className="grid sm:grid-cols-3 gap-3">
                <Resultado big label={`${r.compCalc.opBitola.label} · compressão${r.compCalc.viaFlexao ? "" : " (só torção)"}`} value={r.compCalc.nCertoComp} unit={(r.compCalc.viaFlexao && r.opFlexao.feixe) ? "feixe(s)" : "barra(s)"} />
                <Reading label="As' adotado" value={fmt(r.compCalc.asProvComp, 3)} unit="cm²" />
                <Reading label="Camadas necessárias" value={r.compCalc.camadasComp} unit={r.compCalc.camadasComp === 1 ? "camada" : "camadas"} tone={r.compCalc.camadasComp === 1 ? "good" : "warn"} />
              </div>
            )}
            <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
              Nº de barras/feixes por camada considerado: {r.unitsPerLayerTracao} (largura disponível de {fmt(r.larguraDisponivel, 1)}cm, folga horizontal mínima de 6cm{Number(Bw) >= 14 && Number(Bw) <= 18 ? " — viga de 14 a 18cm: mínimo de 2 barras/camada garantido mesmo com folga menor" : ""}).
            </p>
            {r.feixeVerticalAlt && (
              <div className="mt-4 pt-4" style={{ borderTop: "1px dashed var(--rule)" }}>
                <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--amber)" }}>
                  Folga apertada com 2 feixes lado a lado — alternativa: montar os 2 feixes na vertical
                </div>
                <p className="text-[11px] mb-3" style={{ color: "var(--ink-soft)" }}>
                  Em vez dos 2 feixes {r.opFlexao.label} lado a lado na 1ª camada, monte um sobre o outro (mesma coluna, 4 barras empilhadas na vertical) — libera {fmt(r.feixeVerticalAlt.folgaComVertical, 1)}cm de folga horizontal na 1ª camada, já que só ocupa 1 posição em vez de 2.
                </p>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Reading
                    label="2 feixes na vertical (só)"
                    value={fmt(r.feixeVerticalAlt.as2Feixes, 3)}
                    unit={`cm² · As,nec=${fmt(r.asGovernanteTracao, 3)}cm²`}
                    tone={r.feixeVerticalAlt.opcao1Ok ? "good" : "warn"}
                  />
                  <Reading
                    label={`+ 1 barra Ø${r.ancoragem.diamMm} solta (2ª camada)`}
                    value={fmt(r.feixeVerticalAlt.as2FeixesMais1, 3)}
                    unit="cm²"
                    tone={r.feixeVerticalAlt.opcao2Ok ? "good" : "warn"}
                  />
                  <Reading
                    label={`+ 2 barras Ø${r.ancoragem.diamMm} soltas (2ª camada)`}
                    value={fmt(r.feixeVerticalAlt.as2FeixesMais2, 3)}
                    unit="cm²"
                    tone={r.feixeVerticalAlt.opcao3Ok ? "good" : "warn"}
                  />
                </div>
                <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                  Escolha a primeira opção (da esquerda) que atenda As,nec — {r.feixeVerticalAlt.opcao1Ok
                    ? "os 2 feixes na vertical já bastam sozinhos, sem barra solta adicional."
                    : r.feixeVerticalAlt.opcao2Ok
                    ? "precisa complementar com 1 barra solta na 2ª camada."
                    : r.feixeVerticalAlt.opcao3Ok
                    ? "precisa complementar com 2 barras soltas na 2ª camada."
                    : "nem com 2 barras soltas complementares é suficiente — reavalie a bitola ou o nº de feixes."}
                </p>
              </div>
            )}
            <div className="mt-4 pt-4" style={{ borderTop: "1px dashed var(--rule)" }}>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                <Reading label="As + As' adotado" value={fmt(r.asTotalAtual, 3)} unit="cm²" />
                <Reading label="Taxa atual (As+As')/Ac" value={fmt(r.taxaAtual4, 2)} unit="%" tone={r.dentroTaxaMax4 ? "good" : "warn"} />
                <Reading label="Limite normativo" value="4,00" unit="% Ac" />
                <Reading label="Margem p/ porta-estribo" value={fmt(r.margemPortaEstribo, 3)} unit="cm²" tone="accent" />
              </div>
              <VerdictBadge
                ok={r.dentroTaxaMax4} computable={true}
                okText={`Taxa dentro do limite — ainda cabem ${fmt(r.margemPortaEstribo, 2)}cm² sem ultrapassar 4%`}
                failText={`Taxa excede 4% Ac — reduza a bitola/quantidade antes de acrescentar porta-estribo`}
                insufText="—"
              />
              <p className="text-[11px] mt-2" style={{ color: "var(--ink-soft)" }}>
                NBR 6118 17.3.5.2.4: As + As' ≤ 4% Ac (fora da região de emenda), com Ac = Bw×H = {fmt(r.acBruta, 0)}cm². A margem indicada é o quanto ainda pode ser somado em barras porta-estribo (ou qualquer reforço construtivo) sem ultrapassar o limite.
              </p>
            </div>
          </div>

          {/* 6b. armadura de pele */}
          {r.peleCalc && (
            <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
              <SectionHeader n="11" title="Armadura de pele (lateral)" sub={r.peleObrigatoria ? "obrigatória — H > 60cm" : "não obrigatória (H ≤ 60cm), mas exigida pela torção"} />
              <div className="grid sm:grid-cols-3 gap-3">
                <Resultado big label={`${r.opPele.label} · por face`} value={r.peleCalc.nPorFace} unit="barra(s)" />
                <Reading label="As adotado por face" value={fmt(r.peleCalc.asProvPorFace, 3)} unit="cm²" />
                <Reading label="Espaçamento real" value={fmt(r.peleCalc.sReal, 1)} unit="cm" tone={r.peleCalc.sReal <= 20 ? "good" : "warn"} />
              </div>
              <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                Mínimo normativo: 0,10% Ac,alma por face = {fmt(r.peleMinPorFace, 3)}cm²{r.peleCalc.peleLimitada ? " (limitado a 5cm²/face, sem torção)" : ""}, espaçamento ≤ 20cm.
                {r.peleCalc.viaTorcao && " A torção governa nesta face (Asl lateral > mínimo de pele)."}
                {" "}Barras iguais nas duas faces laterais.
              </p>
            </div>
          )}

          {/* 5. torção */}
          <div className="rounded-lg p-5" style={{ background: "var(--panel)", border: "1px solid var(--rule)" }}>
            <SectionHeader n="12" title="Torção" sub={Number(Tk) === 0 ? "Tk = 0 — sem torção" : "seção vazada equivalente"} />
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
              <Reading label="he adotado" value={fmt(r.he, 3)} unit="m" />
              <Reading label="Ae" value={fmt(r.Ae, 4)} unit="m²" />
              <Reading label="Tsd" value={fmt(r.Tsd, 3)} unit="kN·m" />
              <Reading label="TRd2" value={fmt(r.Trd2, 3)} unit="kN·m" />
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              <Reading label="As90 (estribo torção)" value={fmt(r.As90, 3)} unit="cm²/m" />
              <Reading label="Asl (long. torção)" value={fmt(r.Asl, 3)} unit="cm²" />
              <Reading label="Interação V+T" value={fmt(r.interacao, 3)} unit="≤ 1" />
              {Number(Tk) !== 0 && <Reading label="s,máx torção (ue/8)" value={fmt(r.smaxTorcao, 1)} unit="cm" />}
            </div>
            {Number(Tk) !== 0 && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <Reading label="Asw torção necessário" value={fmt(r.aswTorcaoTotal, 3)} unit="cm²/m" />
                <Reading label="Estribo adotado p/ torção (2 ramos periféricos)" value={fmt(r.asAdotadoTorcao, 3)} unit="cm²/m" tone={r.torcaoEstriboOk ? "good" : "warn"} />
              </div>
            )}
            {Number(Tk) !== 0 && (
              <div className="flex flex-wrap gap-3">
                <VerdictBadge ok={r.torcaoOk} computable={r.torcaoOk !== null} okText="Tsd ≤ TRd2 — PASSOU" failText="Tsd > TRd2 — AUMENTAR SEÇÃO" insufText="Não calculável" />
                <VerdictBadge ok={r.interacaoOk} computable={r.interacaoOk !== null} okText="Vsd/VRd2 + Tsd/TRd2 ≤ 1 — PASSOU" failText="Vsd/VRd2 + Tsd/TRd2 > 1 — AUMENTAR SEÇÃO" insufText="Não calculável" />
                <VerdictBadge ok={r.torcaoEstriboOk} computable={r.torcaoEstriboOk !== null} okText="2 ramos periféricos cobrem a torção" failText="2 ramos periféricos NÃO cobrem a torção — reduza s ou aumente Ø" insufText="—" />
              </div>
            )}
            {Number(Bw) > 30 && Number(Tk) !== 0 && (
              <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>
                Bw&gt;30cm: apenas os 2 ramos periféricos do estribo (o contorno fechado) resistem à torção — os ramos internos contam só para o cisalhamento. O espaçamento adotado também respeita s ≤ ue/8 (NBR 6118), além dos limites usuais de cisalhamento.
              </p>
            )}
          </div>

            </>
          )}

          {/* footer note */}
          <div className="rounded-lg p-4 text-[11px] leading-relaxed" style={{ background: "var(--blue-soft)", border: "1px solid var(--rule)", color: "var(--ink-soft)" }}>
            <span className="font-semibold" style={{ color: "var(--blue)" }}>Base:</span> replica a lógica da planilha "Verificação Viga Retangular" (flexão simples/composta, Md,min, armadura dupla, cisalhamento e torção conforme NBR 6118).
            <br />
            <span className="font-semibold" style={{ color: "var(--blue)" }}>Correções aplicadas:</span> (1) d' agora é calculado pelo centro de gravidade real do alojamento das barras — quando é preciso mais de uma camada, o cálculo itera (recalcula As, nº de camadas e o novo d' até convergir) em vez de assumir sempre uma única camada, e a 1ª camada não recebe folga vertical extra em relação ao estribo; (2) a largura disponível para as barras passou a ser Bw − 2×cobrimento − (nº de ramos × Ø do estribo), com folga mínima de 6cm na horizontal e 2cm na vertical entre camadas; para vigas com Bw entre 14 e 18cm, o mínimo de 2 barras por camada é garantido mesmo que a folga resultante fique abaixo de 6cm; (3) nas fórmulas de As90 e Asl (torção), a planilha original omitia o fator ×10 de conversão tf→kN — incluído para manter a consistência dimensional; (4) o Asl (armadura longitudinal de torção) agora é distribuído nas 4 faces da seção proporcionalmente ao comprimento de cada face (NBR 6118 17.5.1.2), em vez de somado inteiro na face tracionada — cada face horizontal (tração/compressão) recebe sua parcela, e cada face lateral recebe a parcela lateral, que concorre com a armadura de pele; (5) a taxa mínima de armadura (As,mín) agora varia com o Fck conforme a Tabela 17.3 da NBR 6118 (CA-50), em vez de ser fixa em 0,15%.
            <br />
            <span className="font-semibold" style={{ color: "var(--blue)" }}>Armadura de pele:</span> calculada conforme NBR 6118 17.3.5.2.1 (obrigatória para H&gt;60cm, 0,10% Ac,alma por face, s≤20cm); quando há torção, a parcela lateral do Asl é comparada com esse mínimo e a maior governa.
            <br />
            <span className="font-semibold" style={{ color: "var(--blue)" }}>Simplificações assumidas:</span> mesma bitola de flexão usada em tração e compressão; a distribuição do Asl usa uma estimativa inicial de d' (não reiterada); armadura de suspensão não incluída; no desenho, ponto vermelho preenchido = compressão por flexão (dupla), contorno âmbar = compressão apenas por torção.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalculadoraViga />);
</script>
</body>
</html>
